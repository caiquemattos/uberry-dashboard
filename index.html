<html lang="pt-BR">
<head>

<title>U.Berry | Inteligência Operacional</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0E1117;--card:#1A1D27;--border:rgba(108,59,245,.22);
  --primary:#6C3BF5;--purple:#A855F7;--pink:#E879F9;
  --amber:#F59E0B;--green:#34D399;--red:#EF4444;--cyan:#22D3EE;
  --text:#FAFAFA;--muted:#9CA3AF;--dim:#6B7280;--r:10px;--gap:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#2D0A4E,var(--primary));padding:12px 16px;
        position:sticky;top:0;z-index:100;box-shadow:0 2px 24px rgba(0,0,0,.5)}
.hl h1{font-size:1.1rem;font-weight:700;margin-bottom:2px}
.hl p{color:#D8B4FE;font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.35);border-radius:8px;padding:3px;
      overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:6px;font-size:.72rem;font-weight:600;cursor:pointer;
     border:none;background:transparent;color:var(--muted);white-space:nowrap;transition:.15s;flex-shrink:0}
.tab.on{background:var(--primary);color:var(--text);box-shadow:0 0 12px rgba(108,59,245,.5)}
.upd{font-size:.63rem;color:var(--dim);display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.wrap{padding:12px 14px}
.sec{font-size:.63rem;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;
     border-bottom:1px solid rgba(168,85,247,.22);padding-bottom:4px;margin:14px 0 8px;font-weight:700}
.mb{margin-bottom:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media(max-width:700px){.g5,.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.g5,.g4,.g3{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px}
.kpi.pos{border-color:rgba(52,211,153,.38);background:rgba(52,211,153,.04)}
.kpi.neg{border-color:rgba(239,68,68,.38);background:rgba(239,68,68,.04)}
.kpi.warn{border-color:rgba(245,158,11,.38);background:rgba(245,158,11,.04)}
.kl{font-size:.6rem;color:#8B8FA8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.kv{font-size:1.15rem;font-weight:700;line-height:1.2}
.ks{font-size:.65rem;color:var(--purple);margin-top:2px}
.kn{font-size:.6rem;color:var(--dim);margin-top:2px}
.kd{font-size:.67rem;margin-top:3px}
.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--muted)}
.prog-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;margin-bottom:10px}
.prog-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:7px;flex-wrap:wrap;gap:6px}
.prog-lbl{font-size:.72rem;color:var(--muted)}
.prog-val{font-size:1rem;font-weight:700}
.prog-track{height:16px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;transition:width .5s}
.prog-fill span{font-size:.67rem;font-weight:700;color:#fff}
.prog-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:.65rem;color:var(--muted);flex-wrap:wrap;gap:4px}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:10px}
@media(max-width:480px){.tg{grid-template-columns:1fr}}
.tc{background:var(--card);border-radius:var(--r);padding:12px 14px;border-left:3px solid}
.tc.manha{border-color:var(--amber)}.tc.tarde{border-color:var(--primary)}.tc.noite{border-color:var(--pink)}
.tc-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:3px}
.tc-fat{font-size:1.1rem;font-weight:700;margin-bottom:2px}
.tc-meta{font-size:.65rem;color:var(--muted)}
.cb{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 8px;overflow:hidden}
.ct{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:2px}
.note{background:rgba(108,59,245,.07);border-left:3px solid var(--primary);padding:8px 11px;
      border-radius:0 8px 8px 0;font-size:.71rem;color:#C4B5FD;margin-top:8px;line-height:1.6}
.note strong{color:var(--text)}
.alert-ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:8px;padding:9px 12px;font-size:.73rem;color:#6EE7B7;margin-bottom:10px}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:9px 12px;font-size:.73rem;color:#FCD34D;margin-bottom:10px}
.alert-crit{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px 12px;font-size:.73rem;color:#FCA5A5;margin-bottom:10px}
.pe-wrap{background:rgba(108,59,245,.07);border:1px solid rgba(108,59,245,.2);border-radius:8px;
         padding:9px 14px;margin-bottom:10px;font-size:.71rem;color:#C4B5FD;line-height:1.7}
.pe-wrap strong{color:var(--text)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.72rem;min-width:460px}
th{background:var(--card);color:#8B8FA8;text-align:left;padding:6px 9px;font-size:.6rem;
   text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid rgba(255,255,255,.08);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(108,59,245,.07)}
.tr{text-align:right;font-variant-numeric:tabular-nums}
.hi{color:var(--purple);font-weight:600}
.row-neg td{background:rgba(239,68,68,.05)}
.row-neg td.hi{color:var(--red)}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.vc{display:none}.vc.on{display:block}
@media(max-width:480px){
  .kv{font-size:.95rem}
  .kpi{padding:8px 10px}
  .g5,.g4{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr}
  svg text{font-size:7px !important}
}
.footer{text-align:center;padding:12px 14px;color:#374151;font-size:.63rem;
        border-top:1px solid rgba(255,255,255,.05);margin-top:16px;line-height:1.6}
</style>
</head>

// ── PREMISSAS FINANCEIRAS (Modelo B) ───────────────────────────────
// Aluguel: variável 7% do fat., com piso fixo de R$1.500
// Abaixo de R$21.428/mês → aluguel = R$1.500 (fixo, entra nos CF)
// Acima de R$21.428/mês  → aluguel = 7% (variável, sai da MC)
// ── PE lido do JSON (calculado pelo pipeline com dados reais do Cockpit) ──
const ALUG_MIN = 1500, ALUG_PCT = 0.07, GATILHO = ALUG_MIN / ALUG_PCT;
const CMV = D.cmv || 0.35;

function calcPE(fatMes){
  // Se o pipeline já calculou o PE com dados reais do Cockpit, usa direto
  if(D.pe && D.pe.pe_men > 0){
    const pe = D.pe;
    return {
      cf:       pe.cf_total || pe.cf_base || 0,
      mc:       pe.mc || 0.58,
      peMen:    pe.pe_men,
      peDia:    pe.pe_dia,
      alugTipo: pe.aluguel_tipo || "variavel",
      alugValor:pe.aluguel || 0,
      label:    pe.aluguel_tipo === "fixo"
                  ? `Aluguel fixo: R$ ${R0(pe.aluguel)}`
                  : `Aluguel variável: ${(ALUG_PCT*100).toFixed(0)}% do fat.`,
      cf_detalhes: D.cf || {}
    };
  }
  // Fallback: calcula com valores default se JSON não tiver PE
  const fatRef = fatMes || 15000;
  const cf_base = (D.cf && D.cf.total_fixo) ? D.cf.total_fixo : 17226;
  if(fatRef < GATILHO){
    const cf = cf_base + ALUG_MIN;
    const mc = 1 - CMV;
    return {cf, mc, peMen:+(cf/mc).toFixed(2), peDia:+(cf/mc/22).toFixed(2),
            alugTipo:"fixo", alugValor:ALUG_MIN, label:`Aluguel fixo: R$ ${ALUG_MIN}`};
  } else {
    const mc = 1 - CMV - ALUG_PCT;
    return {cf:cf_base, mc, peMen:+(cf_base/mc).toFixed(2), peDia:+(cf_base/mc/22).toFixed(2),
            alugTipo:"variavel", alugValor:+(fatRef*ALUG_PCT).toFixed(2),
            label:`Aluguel variável: ${(ALUG_PCT*100).toFixed(0)}% do fat.`};
  }
}

const R2  = v => "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const R0  = v => "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
const Nb  = v => Number(v).toLocaleString("pt-BR");
const pct = (a,b) => b ? ((a-b)/b*100).toFixed(1) : null;
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;

// ISO week key: a quinta-feira determina o ano ISO, evitando ambiguidade na virada de ano.
// Ex.: 29/dez/2025 (segunda) → semana 1/2026; 30/dez/2024 (segunda) → semana 1/2025.
function isoWeekYear(ds){
  const d=new Date(ds+"T12:00:00");
  const thu=new Date(d); thu.setDate(d.getDate()-((d.getDay()+6)%7)+3);
  const jan4=new Date(thu.getFullYear(),0,4);
  const w=1+Math.round((thu-jan4)/604800000);
  return{iso_year:thu.getFullYear(),sem:w};
}

  if(f.data)     return v.data===f.data;
  if(f.datas)    return f.datas.includes(v.data);
  if(f.sem!=null) return v.sem===f.sem && (v.iso_year!=null?v.iso_year:v.ano)===f.iso_year;
  if(f.mes)      return v.mes===f.mes && v.ano===f.ano;
  if(f.ano)      return v.ano===f.ano;
  return true;
});
const fC = f => D.cats.filter(c => {
  if(f.data)  return c.data===f.data;
  if(f.datas) return f.datas.includes(c.data);
  if(f.sem)   return c.sem===f.sem;
  if(f.mes)   return c.mes===f.mes;
  if(f.ano)   return true; // ano: retorna tudo (já filtrado via fV)
  return true;
});
const fP = f => D.produtos.filter(p => {
  if(f.data)  return p.data===f.data;
  if(f.datas) return f.datas.includes(p.data);
  if(f.mes)   return p.mes===f.mes;
  return true;
});

// ── AGREGAÇÕES ────────────────────────────────────────────────────
function aKpis(vs){
  const fat = vs.reduce((s,v)=>s+v.total,0);
  const n = vs.length, dias = [...new Set(vs.map(v=>v.data))].length||1;
  return{fat:+fat.toFixed(2),n,dias,ticket:n?+(fat/n).toFixed(2):0,
         margem:+(fat*0.65).toFixed(2),fatDia:+(fat/dias).toFixed(2)};
}
function aPorDia(vs){
  const m={};
  vs.forEach(v=>{
    if(!m[v.data])m[v.data]={data:v.data,dia:v.dia,fat:0,n:0};
    m[v.data].fat+=v.total; m[v.data].n++;
  });
  return Object.values(m).sort((a,b)=>a.data>b.data?1:-1)
    .map(r=>({...r,fat:+r.fat.toFixed(2),ticket:+(r.fat/r.n).toFixed(2),
              temp:D.temps?.[r.data]??null}));
}
function aTurno(vs){
  const m={Manha:{fat:0,n:0},Tarde:{fat:0,n:0},Noite:{fat:0,n:0}};
  vs.forEach(v=>{if(m[v.turno]){m[v.turno].fat+=v.total;m[v.turno].n++;}});
  return["Manha","Tarde","Noite"].map(t=>({
    turno:t,fat:+m[t].fat.toFixed(2),n:m[t].n,
    ticket:m[t].n?+(m[t].fat/m[t].n).toFixed(2):0
  }));
}
function aCat(cs){
  const m={};
  cs.forEach(c=>{m[c.cat]=(m[c.cat]||0)+c.sub;});
  return CATS.map(c=>({cat:c,fat:+(m[c]||0).toFixed(2)}));
}
function aCatDia(cs,dias){
  const m={};
  dias.forEach(d=>{m[d]={};CATS.forEach(c=>m[d][c]=0);});
  cs.forEach(c=>{if(m[c.data])m[c.data][c.cat]=(m[c.data][c.cat]||0)+c.sub;});
  return dias.map(d=>({data:d,...m[d]}));
}
function aProd(ps,top=10){
  const m={};
  ps.forEach(p=>{
    if(!m[p.nome])m[p.nome]={nome:p.nome,fat:0,qtd:0};
    m[p.nome].fat+=p.total; m[p.nome].qtd+=p.qtd;
  });
  return Object.values(m).sort((a,b)=>b.fat-a.fat).slice(0,top)
    .map(r=>({...r,fat:+r.fat.toFixed(2)}));
}
// ── HELPERS DE HISTÓRICO ─────────────────────────────────────────
// Normalizam snapshots (faturamento/n_vendas) → formato interno (fat/n).
// Decimais preservados aqui — arredondamento só acontece nos renders (R2/R0/Math.round).

// por_turno snapshot → [{turno, fat, n, ticket}]
function hTurnos(h){
  return (h.por_turno||[]).map(t=>({
    turno:  t.turno,
    fat:    Number(t.faturamento ?? t.fat ?? 0),
    n:      Number(t.n_vendas   ?? t.n   ?? 0),
    ticket: Number(t.ticket     ?? 0)
  }));
}
// por_cat snapshot {Açaí:X,...} → [{cat, fat}] — fat decimal preservado
function hCat(h){
  const m=h.por_cat||{};
  return CATS.map(c=>({cat:c, fat:Number(m[c]||0)}));
}
// Agrega top_produtos de N meses e re-rankeia — fat decimal preservado
function hProds(meses,top=10){
  const acc={};
  meses.forEach(h=>(h.top_produtos||[]).forEach(p=>{
    acc[p.nome]=(acc[p.nome]||0)+Number(p.faturamento??p.fat??0);
  }));
  return Object.entries(acc)
    .sort((a,b)=>b[1]-a[1]).slice(0,top)
    .map(([nome,fat])=>({nome,fat}));
}

// ── Helpers de desconto ─────────────────────────────────────────────
function hDescCat(h){
  const m=h.por_desc_cat||{};
  return Object.entries(m).filter(([,v])=>v>0).map(([cat,desc])=>({cat,desc:Number(desc)}));
}
function hDescProds(meses,top=10){
  const acc={},catAcc={};
  meses.forEach(h=>(h.top_desc_prods||[]).forEach(p=>{
    acc[p.nome]=(acc[p.nome]||0)+Number(p.desc||0);
    catAcc[p.nome]=catAcc[p.nome]||p.cat;
  }));
  return Object.entries(acc).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,top)
    .map(([nome,desc])=>({nome,cat:catAcc[nome]||"",desc}));
}
function hDescTurno(meses){
  const acc={Manha:{desc:0,n:0,top:{}},Tarde:{desc:0,n:0,top:{}},Noite:{desc:0,n:0,top:{}}};
  meses.forEach(h=>{
    const pt=h.por_desc_turno||{};
    ['Manha','Tarde','Noite'].forEach(t=>{
      if(!pt[t]) return;
      acc[t].desc+=Number(pt[t].desc||0); acc[t].n+=Number(pt[t].n||0);
      (pt[t].top||[]).forEach(p=>{acc[t].top[p.nome]=(acc[t].top[p.nome]||0)+Number(p.desc||0);});
    });
  });
  const out={};
  ['Manha','Tarde','Noite'].forEach(t=>{
    out[t]={desc:acc[t].desc,n:acc[t].n,
      top:Object.entries(acc[t].top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([nome,desc])=>({nome,desc}))};
  });
  return out;
}
// Renderiza seção de descontos: KPIs + categorias + produtos + tabela por turno
function descBlock(dTotal,dPct,dN,dCat,dProds,dTurno){

      ${barH(dProds.slice(0,10).map((r,i)=>({l:r.nome,v:r.desc,c:PAL[i%PAL.length]})),dTotal)}
    </div>`:""}
    ${hasTurno?`

    <div class="cb mb" style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:.72rem">
      <thead><tr>${TS.map(t=>`<th style="padding:6px 8px;text-align:left;color:var(--purple);border-bottom:1px solid rgba(108,59,245,.22)">${TL[t]}${(dTurno[t]?.desc||0)>0?' · '+R2(dTurno[t].desc):''}</th>`).join('')}</tr></thead>
      <tbody>${[0,1,2,3,4].map(i=>`<tr>${TS.map(t=>{

      }).join('')}</tr>`).join('')}</tbody>

function aMes(vs){
  const m={};
  vs.forEach(v=>{
    const k=`${v.ano}-${String(v.mes).padStart(2,"0")}`;
    if(!m[k])m[k]={key:k,ano:v.ano,mes:v.mes,fat:0,n:0,dias:new Set()};
    m[k].fat+=v.total; m[k].n++; m[k].dias.add(v.data);
  });
  return Object.values(m).sort((a,b)=>a.key>b.key?1:-1)
    .map(r=>({...r,fat:+r.fat.toFixed(2),dias:r.dias.size,
              ticket:+(r.fat/r.n).toFixed(2),fatDia:+(r.fat/r.dias.size).toFixed(2)}));
}

// ── SVG ENGINE ────────────────────────────────────────────────────
function GL(pl,pr,pt,pb,W,H,n,maxV,unit="R$"){
  let s=""; const ch=H-pt-pb;
  for(let i=0;i<=n;i++){
    const y=pt+ch*i/n, val=maxV*(1-i/n);
    const lbl=unit==="R$"?(val>=1000?`R$${(val/1000).toFixed(0)}k`:`R$${val.toFixed(0)}`):Math.round(val).toString();
    s+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    s+=`<text x="${pl-3}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#6B7280" font-size="8.5" font-family="Segoe UI,sans-serif">${lbl}</text>`;
  }
  return s;
}

// Barras horizontais COM share%
function barH(items, fatTotal, o={}){
  const W=o.W||svgW(), H=o.H||Math.max(240,items.length*(isMob()?28:32)+30);
  const pl=Math.min(isMob()?140:190,W*.38), pr=Math.min(80,W*.14), pt=12, pb=12;
  const cw=W-pl-pr, ch=H-pt-pb, n=items.length;
  const bh=Math.min(26,ch/n*.72), gap=(ch-bh*n)/(n+1);
  const maxV=Math.max(...items.map(x=>x.v))||1;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
  for(let i=0;i<=4;i++){const x=pl+cw*i/4;
    s+=`<line x1="${x.toFixed(1)}" y1="${pt}" x2="${x.toFixed(1)}" y2="${H-pb}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;}
  items.forEach((it,i)=>{
    const y=pt+gap*(i+1)+bh*i, bw2=Math.max(4,cw*(it.v/maxV));
    const sharePct=fatTotal?`${(it.v/fatTotal*100).toFixed(1)}%`:"";
    const lmax=isMob()?16:26;
    const label=sharePct ? `${it.l.slice(0,lmax)} ${sharePct}` : it.l.slice(0,lmax);
    s+=`<rect x="${pl}" y="${y.toFixed(1)}" width="${bw2.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${it.c||PAL[i%PAL.length]}" opacity="0.9"/>`;
    s+=`<text x="${pl-6}" y="${(y+bh/2+4).toFixed(1)}" text-anchor="end" fill="#D1D5DB" font-size="9.5" font-family="Segoe UI,sans-serif">${label}</text>`;
    s+=`<text x="${(pl+bw2+4).toFixed(1)}" y="${(y+bh/2+4).toFixed(1)}" fill="#FAFAFA" font-size="9" font-family="Segoe UI,sans-serif">R$${Math.round(it.v).toLocaleString("pt-BR")}</text>`;
  });
  return s+"</svg>";
}

// Barras empilhadas COM total no topo e legendas DENTRO
function barStack(catDia,o={}){
  const W=o.W||svgW(), pb=o.pb||52;
  const LEG_H=28, H=(o.H||340)+LEG_H;
  const pl=44, pr=14, pt=24;
  const cw=W-pl-pr, ch=H-pt-pb-LEG_H, n=catDia.length;
  const bw=Math.min(54,cw/n*.70), gap=(cw-bw*n)/(n+1);
  const maxV=Math.max(...catDia.map(r=>CATS.reduce((s,c)=>s+(r[c]||0),0)))||1;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
  s+=GL(pl,pr,pt,pb+LEG_H,W,H,4,maxV);
  catDia.forEach((row,i)=>{
    const x=pl+gap*(i+1)+bw*i; let yc=pt+ch;
    const total=CATS.reduce((s2,c)=>s2+(row[c]||0),0);
    CATS.forEach(cat=>{
      const val=row[cat]||0; if(val<=0)return;
      const bh2=ch*(val/maxV); yc-=bh2;
      s+=`<rect x="${x.toFixed(1)}" y="${yc.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh2.toFixed(1)}" fill="${CC[cat]}" opacity="0.93" stroke="#0E1117" stroke-width="0.5"/>`;
      if(bh2>13) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yc+bh2/2+4).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,.88)" font-size="7.5" font-weight="600" font-family="Segoe UI,sans-serif">R$${Math.round(val)}</text>`;
    });
    // Total no topo da barra
    const yTop=pt+ch*(1-total/maxV);
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(yTop-4).toFixed(1)}" text-anchor="middle" fill="#E2E8F0" font-size="8.5" font-weight="700" font-family="Segoe UI,sans-serif">R$${Math.round(total)}</text>`;
    // Labels do eixo X
    const dt=row.data?row.data.slice(5):"";
    const dia=(o.dias_sem&&o.dias_sem[i])||"";
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb-LEG_H+12).toFixed(1)}" text-anchor="middle" fill="#9CA3AF" font-size="8.5" font-family="Segoe UI,sans-serif">${dt}</text>`;
    if(dia) s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb-LEG_H+22).toFixed(1)}" text-anchor="middle" fill="#6B7280" font-size="7.5" font-family="Segoe UI,sans-serif">${dia}</text>`;
    const temp=D.temps?.[row.data]??null;
    if(temp!=null){const tc=temp>=28?"#EF4444":temp>=23?"#F59E0B":"#60A5FA";
      s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb-LEG_H+33).toFixed(1)}" text-anchor="middle" fill="${tc}" font-size="8.5" font-weight="700" font-family="Segoe UI,sans-serif">${temp}°C</text>`;}
  });
  // Legendas DENTRO do SVG (2 linhas, abaixo das barras)
  const legendY=H-pb-LEG_H+44;
  const perRow=3, colW=Math.floor((W-pl)/perRow);
  CATS.forEach((cat,j)=>{
    const rj=Math.floor(j/perRow), cj=j%perRow;
    const lx=pl+cj*colW, ly=legendY+rj*12;
    s+=`<rect x="${lx}" y="${ly-8}" width="8" height="8" rx="2" fill="${CC[cat]}"/>`;
    s+=`<text x="${lx+11}" y="${ly}" fill="#D1D5DB" font-size="8" font-family="Segoe UI,sans-serif">${cat}</text>`;
  });
  return s+"</svg>";
}

function lineBarPE(dias,fats,tickets,o={}){
  const W=o.W||svgW(), H=o.H||270, pl=44, pr=48, pt=24, pb=o.pb||48;
  const cw=W-pl-pr, ch=H-pt-pb, n=dias.length;
  const bw=Math.min(50,cw/n*.68), gap=(cw-bw*n)/(n+1);
  const maxB=Math.max(...fats)||1, maxL=Math.max(...tickets)||1;
  const PE=o.peDia||717;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
  s+=GL(pl,pr,pt,pb,W,H,4,maxB);
  const yPE=pt+ch*(1-PE/maxB);
  if(yPE>=pt&&yPE<=pt+ch){
    s+=`<line x1="${pl}" y1="${yPE.toFixed(1)}" x2="${W-pr}" y2="${yPE.toFixed(1)}" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    s+=`<text x="${W-pr+2}" y="${(yPE+4).toFixed(1)}" fill="#EF4444" font-size="8" font-family="Segoe UI,sans-serif">PE</text>`;
  }
  const bxs=[];
  fats.forEach((fat,i)=>{
    const x=pl+gap*(i+1)+bw*i; bxs.push(x+bw/2);
    const bh=ch*(fat/maxB), y=pt+ch-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${fat>=PE?"#6C3BF5":"#EF4444"}" opacity="0.88"/>`;
  });
  const pts=bxs.map((x,i)=>`${x.toFixed(1)},${(pt+ch*(1-tickets[i]/maxL)).toFixed(1)}`);
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>`;
  bxs.forEach((x,i)=>{const y=pt+ch*(1-tickets[i]/maxL);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#F59E0B"/>`;});
  for(let gi=0;gi<=4;gi++){const tv=maxL*(1-gi/4),ry=pt+ch*gi/4;
    s+=`<text x="${W-pr+3}" y="${(ry+4).toFixed(1)}" text-anchor="start" fill="#F59E0B" font-size="7.5" font-family="Segoe UI,sans-serif">R$${tv.toFixed(0)}</text>`;}
  if(o.lbls) o.lbls.forEach((l,i)=>{s+=`<text x="${bxs[i].toFixed(1)}" y="${(H-pb+12).toFixed(1)}" text-anchor="middle" fill="#9CA3AF" font-size="8.5" font-family="Segoe UI,sans-serif">${l}</text>`;});
  if(o.subs) o.subs.forEach((l,i)=>{s+=`<text x="${bxs[i].toFixed(1)}" y="${(H-pb+22).toFixed(1)}" text-anchor="middle" fill="#6B7280" font-size="7.5" font-family="Segoe UI,sans-serif">${l}</text>`;});
  if(o.temps) o.temps.forEach((t,i)=>{
    if(t==null)return; const tc=t>=28?"#EF4444":t>=23?"#F59E0B":"#60A5FA";
    s+=`<text x="${bxs[i].toFixed(1)}" y="${(H-pb+33).toFixed(1)}" text-anchor="middle" fill="${tc}" font-size="8.5" font-weight="700" font-family="Segoe UI,sans-serif">${t}°C</text>`;});
  return s+"</svg>";
}

function lineArea(lbls,vals,o={}){
  const W=o.W||svgW(), H=o.H||180, pl=44, pr=12, pt=20, pb=32;
  const cw=W-pl-pr, ch=H-pt-pb, n=lbls.length;
  const gap=n>1?cw/(n-1):0;
  const maxV=Math.max(...vals)*1.15||1, minV=Math.min(...vals)*.85;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
  s+=GL(pl,pr,pt,pb,W,H,4,maxV);
  const pts=lbls.map((_,i)=>({x:pl+gap*i,y:pt+ch*(1-(vals[i]-minV)/(maxV-minV||1))}));
  s+=`<polygon points="${pts[0].x},${pt+ch} ${pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")} ${pts[pts.length-1].x},${pt+ch}" fill="rgba(108,59,245,.12)"/>`;
  s+=`<polyline points="${pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ")}" fill="none" stroke="#6C3BF5" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{
    s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#6C3BF5" stroke="#0E1117" stroke-width="1.5"/>`;
    s+=`<text x="${p.x.toFixed(1)}" y="${(p.y-7).toFixed(1)}" text-anchor="middle" fill="#FAFAFA" font-size="8" font-family="Segoe UI,sans-serif">R$${vals[i].toFixed(2)}</text>`;
    s+=`<text x="${p.x.toFixed(1)}" y="${(H-pb+13).toFixed(1)}" text-anchor="middle" fill="#9CA3AF" font-size="8" font-family="Segoe UI,sans-serif">${String(lbls[i]).slice(0,8)}</text>`;
  });
  return s+"</svg>";
}

// ── UI COMPONENTS ─────────────────────────────────────────────────
function kpi(l,v,s,n,c=""){
  return`<div class="kpi ${c}"><div class="kl">${l}</div><div class="kv">${v}</div>${s?`<div class="ks">${s}</div>`:""}${n?`<div class="kn">${n}</div>`:""}</div>`;
}
function kpiD(l,v,d,s,c=""){
  const dn=parseFloat(d),dc=isNaN(dn)?"nt":dn>0?"up":"dn";
  const ds=d===null?`<span class="nt">—</span>`:`<span class="${dc}">${dn>0?"+":""}${dn}% vs ant.</span>`;
  return`<div class="kpi ${c}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="kd">${ds}</div>${s?`<div class="kn">${s}</div>`:""}</div>`;
}
function progBar(fat,meta,lbl,peDia){
  const p=clamp(fat/meta*100,0,100),cor=p>=100?"#34D399":p>=70?"#F59E0B":"#EF4444";

// Análise automática (bullets)
function analise(cfg){
  const{vs,dias,turnos,prods,K,KA,pe,tipo}=cfg;
  const pos=[], atencao=[];
  const peDia=pe.peDia;
  if(KA){
    const d=+pct(K.fat,KA.fat);
    if(d>0) pos.push(`Faturamento <strong>+${d}%</strong> acima do período anterior`);
    else if(d<-10) atencao.push(`Faturamento <strong>${d}%</strong> abaixo do período anterior — queda relevante`);
    const dt=+pct(K.ticket,KA.ticket);
    if(dt>5) pos.push(`Ticket médio cresceu <strong>+${dt}%</strong> — melhora no mix ou upsell`);
    else if(dt<-5) atencao.push(`Ticket médio caiu <strong>${dt}%</strong> — possível mudança no mix`);
  }
  const cob=K.fatDia/peDia*100;
  if(cob>=150) pos.push(`Cobertura do PE em <strong>${cob.toFixed(0)}%</strong> — operação com folga financeira saudável`);
  else if(cob>=100) pos.push(`PE atingido: fat. médio de <strong>${R2(K.fatDia)}/dia</strong> supera o mínimo`);
  else if(cob>=80) atencao.push(`Cobertura do PE em <strong>${cob.toFixed(0)}%</strong> — sem margem de segurança`);
  else atencao.push(`Faturamento médio <strong>${R2(K.fatDia)}/dia</strong> abaixo do PE de ${R2(peDia)}`);
  if(dias?.length){
    const dabaixo=dias.filter(d=>d.fat<peDia);
    if(dabaixo.length===0) pos.push(`Todos os ${dias.length} dias ficaram acima do PE`);
    else if(dabaixo.length<=2) atencao.push(`${dabaixo.length} dia(s) abaixo do PE: <strong>${dabaixo.map(d=>d.data.slice(5)+"("+d.dia+")").join(", ")}</strong>`);
    else atencao.push(`<strong>${dabaixo.length} de ${dias.length} dias</strong> abaixo do PE — padrão preocupante`);
    const dqt=dias.filter(d=>d.temp!=null&&d.temp>=26), dft=dias.filter(d=>d.temp!=null&&d.temp<23);
    if(dqt.length&&dft.length){
      const fmq=avg(dqt.map(d=>d.fat)), fmf=avg(dft.map(d=>d.fat));
      const difP=(((fmq-fmf)/fmf)*100).toFixed(0);
      if(Math.abs(parseFloat(difP))>=15){
        const msg=`Dias quentes (≥26°C): <strong>${R2(fmq)}/dia</strong> vs frios (&lt;23°C): <strong>${R2(fmf)}/dia</strong> — diferença de <strong>${difP}%</strong>`;
        parseFloat(difP)>0?pos.push(msg):atencao.push(msg);
      }
    }
  }
  if(turnos?.length){
    const total=turnos.reduce((s,t)=>s+t.fat,0)||1;
    const dom=turnos.reduce((a,b)=>b.fat>a.fat?b:a,turnos[0]);
    const pctDom=(dom.fat/total*100).toFixed(0);
    if(+pctDom>=50) atencao.push(`Turno <strong>${TN[dom.turno]}</strong> concentra <strong>${pctDom}%</strong> — alta dependência`);
    else pos.push(`Mix de turnos equilibrado: <strong>${TN[dom.turno]}</strong> lidera com ${pctDom}%`);
    const fraco=turnos.reduce((a,b)=>b.fat<a.fat?b:a,turnos[0]);
    const pctF=(fraco.fat/total*100).toFixed(0);
    if(+pctF<15&&fraco.n>0) atencao.push(`Turno <strong>${TN[fraco.turno]}</strong> com apenas <strong>${pctF}%</strong> — oportunidade de ativação`);
  }
  if(prods?.length){
    const top3=prods.slice(0,3).reduce((s,p)=>s+p.fat,0);
    const conc=(top3/K.fat*100).toFixed(0);
    if(+conc>60) atencao.push(`Top 3 produtos concentram <strong>${conc}%</strong> — portfólio concentrado`);
    if(prods[0]) pos.push(`Produto líder: <strong>${prods[0].nome.trim()}</strong> com ${(prods[0].fat/K.fat*100).toFixed(0)}% do total`);
  }
  if(tipo==="mes"&&K.dias<22){
    const proj=+(K.fat+K.fatDia*(22-K.dias)).toFixed(2);
    const peMenRef=pe.peMen;
    if(proj>=peMenRef) pos.push(`Projeção de fechamento: <strong>${R2(proj)}</strong> — acima do PE mensal`);
    else atencao.push(`Projeção: <strong>${R2(proj)}</strong> — abaixo do PE de ${R2(peMenRef)}`);
  }
  return{pos,atencao};
}

    ${(clAten.length?clAten:atencao).length?`<ul style="list-style:none">${li(clAten.length?clAten:atencao,"⚠️","#F59E0B","#FEF3C7")}</ul>`:""}
    ${recHTML}

      const dCs=cs.filter(c=>(c.desc||0)>0);
      const dTotal=cs.reduce((s,c)=>s+(c.desc||0),0);
      const dFatB=cs.reduce((s,c)=>s+(c.sub||0)+(c.desc||0),0);
      const dPct=dFatB?dTotal/dFatB:0;
      const dN=new Set(dCs.map(c=>c.id)).size;
      const cAcc={};dCs.forEach(c=>{cAcc[c.cat]=(cAcc[c.cat]||0)+c.desc;});
      const dCat=Object.entries(cAcc).map(([cat,desc])=>({cat,desc}));
      const pAcc={};ps.filter(p=>(p.desc||0)>0).forEach(p=>{pAcc[p.nome]=(pAcc[p.nome]||0)+p.desc;});
      const dProds=Object.entries(pAcc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,d])=>({nome:n,desc:d}));
      const dT={};['Manha','Tarde','Noite'].forEach(t=>{
        const tp=ps.filter(p=>p.turno===t&&(p.desc||0)>0);
        const tA={};tp.forEach(p=>{tA[p.nome]=(tA[p.nome]||0)+p.desc;});
        dT[t]={desc:tp.reduce((s,p)=>s+p.desc,0),n:tp.length,
          top:Object.entries(tA).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,d])=>({nome:n,desc:d}))};
      });
      return descBlock(dTotal,dPct,dN,dCat,dProds,dT);
    })()}`;
}

function vSemana(){
  // ── Agrega dados por SEMANA ISO usando historico_meses[].por_dia ────────
  // Fonte: todos os meses do histórico (não só o corrente).
  // Chave: "${iso_year}-S${semana_iso}" — imune a virada de ano.
  const semMap = {};
  const _dayTemp = {};  // data → temp para todos os meses
  (D.historico_meses||[]).forEach(h=>{
    (h.por_dia||[]).forEach(d=>{
      const {iso_year,sem}=isoWeekYear(d.data);
      const k=`${iso_year}-S${String(sem).padStart(2,"0")}`;
      if(!semMap[k]) semMap[k]={key:k,sem,iso_year,ano:iso_year,fat:0,n:0,datas:new Set(),turnos:{}};
      semMap[k].fat+=+(d.faturamento||0);
      semMap[k].n+=+(d.n_vendas||0);
      semMap[k].datas.add(d.data);
      if(d.temp!=null) _dayTemp[d.data]=d.temp;
    });
  });

  // ── catSemMap: categorias por semana ISO ─────────────────────────
  // Pass 1 — por_cat_dia: dado exato (meses processados após o fix do pipeline)
  const catSemMap = {};
  const _covDia = new Set(); // datas já cobertas com dado exato
  (D.historico_meses||[]).forEach(h=>{
    Object.entries(h.por_cat_dia||{}).forEach(([data,cats])=>{
      const {iso_year,sem}=isoWeekYear(data);
      const k=`${iso_year}-S${String(sem).padStart(2,"0")}`;
      if(!catSemMap[k]){catSemMap[k]={key:k};CATS.forEach(c=>catSemMap[k][c]=0);}
      Object.entries(cats).forEach(([cat,v])=>{
        if(catSemMap[k][cat]!=null) catSemMap[k][cat]+=Number(v);
      });
      _covDia.add(data);
    });
  });
  // Pass 2 — aproximação proporcional para meses sem por_cat_dia (ex.: snapshots antigos)
  // Distribui por_cat mensal pelos dias de por_dia proporcionalmente ao fat diário.
  (D.historico_meses||[]).forEach(h=>{
    if(!h.por_cat||!h.por_dia||!h.por_dia.length) return;
    const diasNovos=h.por_dia.filter(d=>!_covDia.has(d.data));
    if(!diasNovos.length) return;
    const fatTotal=diasNovos.reduce((s,d)=>s+(d.faturamento||0),0)||1;
    diasNovos.forEach(d=>{
      const ratio=(d.faturamento||0)/fatTotal;
      const {iso_year,sem}=isoWeekYear(d.data);
      const k=`${iso_year}-S${String(sem).padStart(2,"0")}`;
      if(!catSemMap[k]){catSemMap[k]={key:k};CATS.forEach(c=>catSemMap[k][c]=0);}
      Object.entries(h.por_cat).forEach(([cat,v])=>{
        if(catSemMap[k][cat]!=null) catSemMap[k][cat]+=Number(v)*ratio;
      });
      _covDia.add(d.data);
    });
  });
  // Pass 3 — D.cats: datas do mês corrente ainda não cobertas (antes do pipeline re-rodar)
  D.cats.forEach(c=>{
    if(_covDia.has(c.data)) return;
    const {iso_year,sem}=isoWeekYear(c.data||"2000-01-01");
    const k=`${iso_year}-S${String(sem).padStart(2,"0")}`;
    if(!catSemMap[k]){catSemMap[k]={key:k};CATS.forEach(cat=>catSemMap[k][cat]=0);}
    catSemMap[k][c.cat]=(catSemMap[k][c.cat]||0)+c.sub;
  });

  // Temperatura: média dos dias de cada semana (histórico + D.temps)
  const tempSemMap = {};
  Object.values(semMap).forEach(s => {
    const temps = [...s.datas].map(d => _dayTemp[d]??D.temps?.[d]).filter(t => t != null);
    tempSemMap[s.key] = temps.length ? +(temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1) : null;
  });

  const semanas = Object.values(semMap).sort((a,b) => a.key > b.key ? 1 : -1)
    .map(s => ({
      ...s,
      datas: [...s.datas].sort(),
      dias: s.datas.size,
      fat: +s.fat.toFixed(2),
      ticket: +(s.fat/s.n).toFixed(2),
      fatDia: +(s.fat/s.datas.size).toFixed(2),
      tempMedia: tempSemMap[s.key],
    }));

  if(!semanas.length){ document.getElementById("v-semana").innerHTML=
    `<div style="padding:32px;text-align:center;color:var(--muted)">Sem dados de semanas.</div>`; return; }

  const semAtual = semanas[semanas.length-1];
  const semAnt   = semanas.length>=2 ? semanas[semanas.length-2] : null;

  // KPIs da semana atual vs anterior
  const pe = calcPE(semAtual.fatDia * 22);
  const peSem = +(pe.peDia * semAtual.dias).toFixed(2);
  const proj  = semAtual.dias < 5 ? +(semAtual.fat + semAtual.fatDia*(5-semAtual.dias)).toFixed(2) : semAtual.fat;

  // Dados ricos (categorias/turnos) só disponíveis para semanas do mês corrente (D.vendas)
  const vsAtual = fV({sem:semAtual.sem, iso_year:semAtual.iso_year});
  const vsAnt2  = semAnt ? fV({sem:semAnt.sem, iso_year:semAnt.iso_year}) : [];
  const KA2     = vsAnt2.length ? aKpis(vsAnt2) : null;
  const KAtual  = aKpis(vsAtual);
  const turnosAtual = aTurno(vsAtual);

  // Categorias por semana (empilhado)
  const catSemanas = semanas.map(s => ({data: s.key, ...catSemMap[s.key]||{}}));

  // ── SVG: Barras fat. por semana + linha ticket + linha PE ─────
  const W=svgW(), H=270, pl=44, pr=48, pt=24, pb=56;
  const cw=W-pl-pr, ch=H-pt-pb, n=semanas.length;
  const bw=Math.min(60,cw/n*0.68), gap=(cw-bw*n)/(n+1);
  const maxB=Math.max(...semanas.map(s=>s.fat))||1;
  const maxL=Math.max(...semanas.map(s=>s.ticket))||1;
  const peRef = pe.peDia * 5; // PE para 5 dias úteis

  let svgSem = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
  svgSem += GL(pl,pr,pt,pb,W,H,4,maxB);

  // Linha PE semanal
  const yPE = pt+ch*(1-peRef/maxB);
  if(yPE>=pt&&yPE<=pt+ch){
    svgSem+=`<line x1="${pl}" y1="${yPE.toFixed(1)}" x2="${W-pr}" y2="${yPE.toFixed(1)}" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>`;
    svgSem+=`<text x="${W-pr+2}" y="${(yPE+4).toFixed(1)}" fill="#EF4444" font-size="8" font-family="Segoe UI,sans-serif">PE</text>`;
  }

  const bxs=[];
  semanas.forEach((s,i)=>{
    const x=pl+gap*(i+1)+bw*i; bxs.push(x+bw/2);
    const bh=ch*(s.fat/maxB), y=pt+ch-bh;
    const isCurrent = s.key === semAtual.key;
    const col = s.fat >= peRef ? (isCurrent?"#8B5CF6":"#6C3BF5") : "#EF4444";
    svgSem+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}" opacity="${isCurrent?1:0.75}" stroke="${isCurrent?"#A78BFA":"none"}" stroke-width="1.5"/>`;
    svgSem+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" fill="#E2E8F0" font-size="8" font-family="Segoe UI,sans-serif">R$${Math.round(s.fat).toLocaleString("pt-BR")}</text>`;
    svgSem+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb+12).toFixed(1)}" text-anchor="middle" fill="${isCurrent?"#A78BFA":"#9CA3AF"}" font-size="8.5" font-weight="${isCurrent?"700":"400"}" font-family="Segoe UI,sans-serif">S${s.sem}</text>`;
    svgSem+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb+22).toFixed(1)}" text-anchor="middle" fill="#6B7280" font-size="7.5" font-family="Segoe UI,sans-serif">${s.datas[0]?.slice(5)||""}</text>`;
    // Temperatura média
    if(s.tempMedia!=null){
      const tc=s.tempMedia>=28?"#EF4444":s.tempMedia>=23?"#F59E0B":"#60A5FA";
      svgSem+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb+33).toFixed(1)}" text-anchor="middle" fill="${tc}" font-size="8.5" font-weight="700" font-family="Segoe UI,sans-serif">${s.tempMedia}°C</text>`;
    }
  });
  // Linha ticket
  const tickPts=bxs.map((x,i)=>`${x.toFixed(1)},${(pt+ch*(1-semanas[i].ticket/maxL)).toFixed(1)}`);
  svgSem+=`<polyline points="${tickPts.join(" ")}" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>`;
  bxs.forEach((x,i)=>{const y=pt+ch*(1-semanas[i].ticket/maxL);
    svgSem+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#F59E0B"/>`;});
  // Eixo direito (ticket)
  for(let gi=0;gi<=4;gi++){const tv=maxL*(1-gi/4),ry=pt+ch*gi/4;
    svgSem+=`<text x="${W-pr+3}" y="${(ry+4).toFixed(1)}" text-anchor="start" fill="#F59E0B" font-size="7.5" font-family="Segoe UI,sans-serif">R$${tv.toFixed(0)}</text>`;}
  // Legenda
  svgSem+=`<rect x="${pl}" y="${H-4}" width="8" height="7" rx="2" fill="#6C3BF5"/>`;
  svgSem+=`<text x="${pl+11}" y="${H}" fill="#9CA3AF" font-size="7.5" font-family="Segoe UI,sans-serif">Fat. semanal (roxo=acima PE · vermelho=abaixo) · borda clara=semana atual</text>`;
  svgSem += "</svg>";

  // ── SVG: Mix de categorias por semana (empilhado) ─────────────
  const svgCatSem = (()=>{
    const W2=svgW(), H2=300, pl2=44, pr2=14, pt2=24, pb2=56;
    const cw2=W2-pl2-pr2, ch2=H2-pt2-pb2, n2=semanas.length;
    const bw2=Math.min(60,cw2/n2*.70), gap2=(cw2-bw2*n2)/(n2+1);
    const maxV=Math.max(...semanas.map(s=>CATS.reduce((sum,c)=>{
      const row=catSemMap[s.key]||{}; return sum+(row[c]||0);},0)))||1;
    let s2=`<svg viewBox="0 0 ${W2} ${H2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">`;
    s2+=GL(pl2,pr2,pt2,pb2,W2,H2,4,maxV);
    semanas.forEach((sem,i)=>{
      const x=pl2+gap2*(i+1)+bw2*i; let yc=pt2+ch2;
      const row=catSemMap[sem.key]||{};
      const total=CATS.reduce((sum,c)=>sum+(row[c]||0),0);
      CATS.forEach(cat=>{
        const val=row[cat]||0; if(val<=0)return;
        const bh2_=ch2*(val/maxV); yc-=bh2_;
        s2+=`<rect x="${x.toFixed(1)}" y="${yc.toFixed(1)}" width="${bw2.toFixed(1)}" height="${bh2_.toFixed(1)}" fill="${CC[cat]}" opacity="0.93" stroke="#0E1117" stroke-width="0.5"/>`;
        if(bh2_>13) s2+=`<text x="${(x+bw2/2).toFixed(1)}" y="${(yc+bh2_/2+4).toFixed(1)}" text-anchor="middle" fill="rgba(255,255,255,.88)" font-size="7" font-weight="600" font-family="Segoe UI,sans-serif">R$${Math.round(val)}</text>`;
      });
      // Total no topo
      const yTop=pt2+ch2*(1-total/maxV);
      s2+=`<text x="${(x+bw2/2).toFixed(1)}" y="${(yTop-4).toFixed(1)}" text-anchor="middle" fill="#E2E8F0" font-size="8.5" font-weight="700" font-family="Segoe UI,sans-serif">R$${Math.round(total).toLocaleString("pt-BR")}</text>`;
      const isCur=sem.key===semAtual.key;
      s2+=`<text x="${(x+bw2/2).toFixed(1)}" y="${(H2-pb2+12).toFixed(1)}" text-anchor="middle" fill="${isCur?"#A78BFA":"#9CA3AF"}" font-size="8.5" font-weight="${isCur?"700":"400"}" font-family="Segoe UI,sans-serif">S${sem.sem}</text>`;
    });
    // Legendas dentro
    const perRow=3, colW=Math.floor((W2-pl2)/perRow);
    CATS.forEach((cat,j)=>{
      const rj=Math.floor(j/perRow), cj=j%perRow;
      const lx=pl2+cj*colW, ly=H2-pb2+36+rj*12;
      s2+=`<rect x="${lx}" y="${ly-8}" width="8" height="8" rx="2" fill="${CC[cat]}"/>`;
      s2+=`<text x="${lx+11}" y="${ly}" fill="#D1D5DB" font-size="8" font-family="Segoe UI,sans-serif">${cat}</text>`;
    });
    return s2+"</svg>";
  })();

  // ── TABELA RESUMO POR SEMANA ──────────────────────────────────
  const tabelaSem = `<div class="tw"><table>
    <thead><tr>
      <th>Semana</th><th style="text-align:center">Dias</th>
      <th style="text-align:right">Fat. Total</th>
      <th style="text-align:right">Fat./Dia</th>
      <th style="text-align:right">Ticket</th>
      <th style="text-align:center">Temp. Méd.</th>
      <th style="text-align:center">Cob. PE</th>
    </tr></thead>
    <tbody>${[...semanas].reverse().map(s=>{
      const cobS=Math.round(s.fat/peRef*100), ic=cobS>=100?"🟢":cobS>=80?"🟡":"🔴";
      const tc=s.tempMedia>=28?"#EF4444":s.tempMedia>=23?"#F59E0B":s.tempMedia!=null?"#60A5FA":"";
      const isCur=s.key===semAtual.key;
      return`<tr style="${isCur?"background:rgba(108,59,245,.12);":""}">
        <td><strong style="${isCur?"color:#A78BFA":""}">${s.key}${isCur?" ◀ atual":""}</strong><br>
          <span style="font-size:.65rem;color:var(--dim)">${s.datas[0]?.slice(5)||""} → ${s.datas[s.datas.length-1]?.slice(5)||""}</span></td>
        <td style="text-align:center">${s.dias}</td>
        <td class="tr hi">${R2(s.fat)}</td>
        <td class="tr">${R2(s.fatDia)}</td>
        <td class="tr">${R2(s.ticket)}</td>
        <td style="text-align:center;color:${tc};font-weight:700">${s.tempMedia!=null?s.tempMedia+"°C":"—"}</td>
        <td style="text-align:center">${ic} ${cobS}%</td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;

  // ── MONTA HTML ────────────────────────────────────────────────
  document.getElementById("v-semana").innerHTML=`
    <div class="sec">📊 KPIs — Semana ${semAtual.sem}/${semAtual.ano} vs Semana Anterior</div>
    <div class="g5 mb">
      ${kpiD("Fat. Semana Atual",R2(semAtual.fat),semAnt?pct(semAtual.fat,semAnt.fat):null,`${semAtual.dias} dias úteis`,semAtual.fat>=semAnt?.fat?"pos":"neg")}
      ${kpiD("Transações",Nb(semAtual.n),semAnt?pct(semAtual.n,semAnt.n):null,`~${(semAtual.n/semAtual.dias).toFixed(0)}/dia`,"")}
      ${kpiD("Ticket Médio",R2(semAtual.ticket),semAnt?pct(semAtual.ticket,semAnt.ticket):null,"",semAtual.ticket>=(semAnt?.ticket||0)?"pos":"neg")}
      ${kpi("Fat./Dia",R2(semAtual.fatDia),`PE/dia: ${R2(pe.peDia)}`,"",semAtual.fatDia>=pe.peDia?"pos":"neg")}
      ${kpi("Temp. Média",semAtual.tempMedia!=null?semAtual.tempMedia+"°C":"—",semAnt?.tempMedia!=null?`ant.: ${semAnt.tempMedia}°C`:"","","")}
    </div>
    ${alerta(semAtual.fatDia, pe.peDia)}
    <div class="g3 mb">
      ${kpi("PE Semanal",R0(peSem),`${semAtual.dias} dias úteis`,"")}
      ${kpi("Cobertura",`${Math.round(semAtual.fat/peSem*100)}%`,R2(semAtual.fat),R2(peSem),semAtual.fat>=peSem?"pos":"warn")}
      ${kpi("Projeção Fechamento",R0(proj),semAtual.dias<5?`+${5-semAtual.dias} dia(s) no ritmo`:"semana encerrada",proj>=peSem?"pos":"warn")}
    </div>
    ${renderAnalise({vs:vsAtual,dias:null,turnos:turnosAtual,prods:[],K:KAtual,KA:KA2,pe,tipo:"semana"})}
    <div class="sec">📈 Evolução Semanal — Faturamento e Ticket</div>
    <div class="cb mb">
      <div class="ct">Fat. por semana · ticket (âmbar) · PE semanal (vermelho) · temp. média · S atual destacada</div>
      ${svgSem}
    </div>
    <div class="sec">📦 Mix de Categorias por Semana</div>
    <div class="cb mb">
      <div class="ct">Categorias empilhadas por semana · total no topo</div>
      ${svgCatSem}
    </div>
    <div class="sec">📅 Resumo por Semana</div>
    ${tabelaSem}
    <div class="sec">🏷️ Descontos da Semana — ${semAtual.key}</div>
    ${(()=>{
      const _datas=semAtual.datas||[];
      // KPI: de por_desc_dia do historico (cobre todas as semanas, inclusive históricas)
      let dTotal=0,dFatB=0,dN=0;
      const _covD=new Set();
      (D.historico_meses||[]).forEach(h=>{
        _datas.forEach(data=>{
          const e=(h.por_desc_dia||{})[data];
          if(e&&!_covD.has(data)){dTotal+=e.desc;dFatB+=e.fat_bruta;dN+=e.n;_covD.add(data);}
        });
      });
      // Fallback D.cats para datas não cobertas pelo histórico
      const _dcsFall=fC({datas:_datas}).filter(c=>!_covD.has(c.data));
      _dcsFall.forEach(c=>{dTotal+=(c.desc||0);dFatB+=(c.sub||0)+(c.desc||0);});
      dN+=new Set(_dcsFall.filter(c=>(c.desc||0)>0).map(c=>c.id)).size;
      const dPct=dFatB?dTotal/dFatB:0;
      // Cat/Prod/Turno: D.cats/D.produtos filtrados aos dias da semana
      const csSem=fC({datas:_datas}),psSem=fP({datas:_datas});
      const cAcc={};csSem.filter(c=>(c.desc||0)>0).forEach(c=>{cAcc[c.cat]=(cAcc[c.cat]||0)+c.desc;});
      const dCat=Object.entries(cAcc).map(([cat,desc])=>({cat,desc}));
      const pAcc={};psSem.filter(p=>(p.desc||0)>0).forEach(p=>{pAcc[p.nome]=(pAcc[p.nome]||0)+p.desc;});
      const dProds=Object.entries(pAcc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([n,d])=>({nome:n,desc:d}));
      const dT={};['Manha','Tarde','Noite'].forEach(t=>{
        const tp=psSem.filter(p=>p.turno===t&&(p.desc||0)>0);
        const tA={};tp.forEach(p=>{tA[p.nome]=(tA[p.nome]||0)+p.desc;});
        dT[t]={desc:tp.reduce((s,p)=>s+p.desc,0),n:tp.length,
          top:Object.entries(tA).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,d])=>({nome:n,desc:d}))};
      });
      return descBlock(dTotal,dPct,dN,dCat,dProds,dT);
    })()}`;
}

function vMes(){
  // Usa historico_meses como lista de meses (cobre todos os meses desde o início).
  // Fallback para aMes(D.vendas) se histórico não disponível (apenas mês corrente).
  const _hist=(D.historico_meses&&D.historico_meses.length>0)?D.historico_meses:null;
  const mA=_hist?_hist[_hist.length-1]:(()=>{const m=aMes(D.vendas);return m[m.length-1];})();
  const mB=_hist?(_hist.length>=2?_hist[_hist.length-2]:null):(()=>{const m=aMes(D.vendas);return m.length>=2?m[m.length-2]:null;})();

  // Dados ricos (categorias/produtos/turnos): disponíveis apenas para o mês em D.vendas
  const vs=fV({mes:mA.mes,ano:mA.ano}), vsAnt=mB?fV({mes:mB.mes,ano:mB.ano}):[];
  const cs=fC({mes:mA.mes}), ps=fP({mes:mA.mes});

  // KPIs: usa campos pré-calculados do histórico; fallback calcula de D.vendas
  const K=mA.fat!=null
    ?{fat:mA.fat,n:mA.n,dias:mA.dias,ticket:mA.ticket,margem:+(mA.fat*0.65).toFixed(2),fatDia:mA.fatDia}
    :aKpis(vs);
  const KA=mB&&mB.fat!=null
    ?{fat:mB.fat,n:mB.n,dias:mB.dias,ticket:mB.ticket,margem:+(mB.fat*0.65).toFixed(2),fatDia:mB.fatDia}
    :(vsAnt.length?aKpis(vsAnt):null);

  // Dias: usa por_dia do histórico (cobre qualquer mês); fallback para D.vendas
  const _diasHist=(mA.por_dia||[]).map(d=>({
    data:d.data, dia:d.dia||"",
    fat:+(d.faturamento||d.fat||0), n:+(d.n_vendas||d.n||0),
    ticket:+(d.ticket||0), temp:d.temp??null
  }));
  const dias=_diasHist.length?_diasHist:aPorDia(vs);
  // Turnos: historico_meses se disponível; fallback D.vendas
  const _tHist=hTurnos(mA);
  const turnos=_tHist.some(t=>t.fat>0)?_tHist:(vs.length?aTurno(vs):[{turno:"Manha",fat:0,n:0,ticket:0},{turno:"Tarde",fat:0,n:0,ticket:0},{turno:"Noite",fat:0,n:0,ticket:0}]);
  // Categorias totais: historico_meses se disponível; fallback D.cats
  const _cHist=hCat(mA);
  const catTotais=_cHist.some(c=>c.fat>0)?_cHist:aCat(cs);
  // Produtos: historico_meses se disponível; fallback D.produtos
  const prods=mA.top_produtos?.length?hProds([mA]):aProd(ps,10);
  // Categorias por dia: apenas D.cats (sem desagregação diária no histórico)
  const catDia=aCatDia(cs,dias.map(d=>d.data));
  const pe=calcPE(K.fat);
  const diasAbaixo=dias.filter(d=>d.fat<pe.peDia);
  const projMes=+(K.fat+K.fatDia*Math.max(0,22-K.dias)).toFixed(2);
  const dqt=dias.filter(d=>d.temp!=null&&d.temp>=26), dft=dias.filter(d=>d.temp!=null&&d.temp<23);
  const fmq=dqt.length?avg(dqt.map(d=>d.fat)):0, fmf=dft.length?avg(dft.map(d=>d.fat)):0;
  document.getElementById("v-mes").innerHTML=`
    <div class="sec">📊 KPIs — ${MN[mA.mes]}/${mA.ano}</div>
    <div class="g5 mb">
      ${kpiD("Faturamento",R2(K.fat),KA?pct(K.fat,KA.fat):null,`${K.dias} dias`,"")}
      ${kpiD("Transações",Nb(K.n),KA?pct(K.n,KA.n):null,`~${(K.n/K.dias).toFixed(0)}/dia`,"")}
      ${kpiD("Ticket Médio",R2(K.ticket),KA?pct(K.ticket,KA.ticket):null,"","")}
      ${kpi("Margem Bruta",R2(K.margem),"65% do fat.","")}
      ${kpi("Fat. Médio/Dia",R2(K.fatDia),"","")}
    </div>
    <div class="sec">⚖️ Ponto de Equilíbrio</div>
    ${peBlock(K.fat,K.fatDia)}
    <div class="sec">🎯 Projeção de Fechamento</div>
    ${progBar(K.fat,pe.peMen,`Acumulado vs PE Mensal (${MN[mA.mes]})`,pe.peDia)}
    <div class="g3 mb">
      ${kpi("Projeção",R0(projMes),K.dias<22?`+${22-K.dias} dia(s) no ritmo`:"mês encerrado",projMes>=pe.peMen?"pos":"warn")}
      ${kpi("Dias Abaixo PE",`${diasAbaixo.length} de ${K.dias}`,diasAbaixo.length?diasAbaixo.map(d=>d.data.slice(5)).join(" · "):"todos acima","",diasAbaixo.length===0?"pos":diasAbaixo.length<=2?"warn":"neg")}
      ${kpiD("vs Mês Anterior",R2(K.fat),KA?pct(K.fat,KA.fat):null,KA?`anterior: ${R2(KA.fat)}`:"","",KA&&K.fat>KA.fat?"pos":"neg")}
    </div>
    ${D.meta_mensal?`<div class="sec">🏆 Metas</div>
    ${metaBlock(D.meta_mensal,D.dias_uteis,D.meta_dia,D.meta_restante,D.ritmo_dia,K.fat,K.dias)}`:""}
    ${renderAnalise({vs,dias,turnos,prods,K,KA,pe,tipo:"mes"})}
    <div class="sec">📈 Evolução Diária</div>
    <div class="cb mb"><div class="ct">Fat. diário · ticket · PE · temperatura</div>
      ${lineBarPE(dias.map(d=>d.data),dias.map(d=>d.fat),dias.map(d=>d.ticket),
        {lbls:dias.map(d=>d.data.slice(5)),subs:dias.map(d=>d.dia||""),temps:dias.map(d=>d.temp),peDia:pe.peDia})}
    </div>
    <div class="sec">📉 Evolução do Ticket Médio</div>
    <div class="cb mb"><div class="ct">Ticket médio por dia</div>
      ${lineArea(dias.map(d=>d.data.slice(5)),dias.map(d=>d.ticket))}
    </div>
    <div class="sec">⏰ Resultado por Turno</div>
    ${turnoCards(turnos)}
    <div class="sec">🌡️ Temperatura × Faturamento</div>
    <div class="cb mb"><div class="ct">Fat. diário · temperatura máxima Curitiba</div>
      ${lineBarPE(dias.map(d=>d.data),dias.map(d=>d.fat),dias.map(d=>d.ticket),
        {lbls:dias.map(d=>d.data.slice(5)),temps:dias.map(d=>d.temp),peDia:pe.peDia})}
      ${dqt.length&&dft.length?`<div class="note">
        Dias quentes (≥26°C): média <strong>${R2(fmq)}/dia</strong> ·
        Dias frios (&lt;23°C): média <strong>${R2(fmf)}/dia</strong> ·
        Diferença: <strong style="color:${fmq>fmf?"#34D399":"#EF4444"}">${(((fmq-fmf)/fmf)*100).toFixed(0)}%</strong>
      </div>`:""}
    </div>
    <div class="sec">📦 Mix de Categorias por Dia</div>
    <div class="cb mb"><div class="ct">Categorias empilhadas · total no topo · temperatura abaixo</div>
      ${barStack(catDia,{dias_sem:dias.map(d=>d.dia||"")})}
    </div>
    <div class="sec">📊 Faturamento por Categoria</div>
    <div class="cb mb"><div class="ct">Top categorias · maior → menor · share%</div>
      ${barH([...catTotais].filter(c=>c.fat>0).sort((a,b)=>b.fat-a.fat)
        .map((c,i)=>({l:c.cat,v:c.fat,c:CC[c.cat]||PAL[i]})),K.fat)}
    </div>
    <div class="sec">🏆 Top 10 Produtos do Mês</div>
    <div class="cb mb"><div class="ct">Top produtos · maior → menor · share%</div>
      ${barH(prods.map((r,i)=>({l:r.nome,v:r.fat,c:PAL[i%PAL.length]})),K.fat)}
    </div>
    <div class="sec">🏷️ Descontos do Mês — ${MN[mA.mes]}/${mA.ano}</div>
    ${(()=>{
      const dTotal=mA.desc_total||0,dPct=mA.desc_pct||0,dN=mA.n_com_desc||0;
      const dCat=hDescCat(mA).length?hDescCat(mA):(()=>{
        const a={};cs.filter(c=>(c.desc||0)>0).forEach(c=>{a[c.cat]=(a[c.cat]||0)+c.desc;});
        return Object.entries(a).map(([cat,desc])=>({cat,desc}));})();
      const dProds=mA.top_desc_prods?.length?mA.top_desc_prods:(()=>{
        const a={};ps.filter(p=>(p.desc||0)>0).forEach(p=>{a[p.nome]=(a[p.nome]||0)+p.desc;});
        return Object.entries(a).sort((b,c)=>c[1]-b[1]).slice(0,10).map(([n,d])=>({nome:n,desc:d}));})();
      const dT=mA.por_desc_turno&&Object.keys(mA.por_desc_turno).length?mA.por_desc_turno:(()=>{
        const dt={};['Manha','Tarde','Noite'].forEach(t=>{
          const tp=ps.filter(p=>p.turno===t&&(p.desc||0)>0);
          const tA={};tp.forEach(p=>{tA[p.nome]=(tA[p.nome]||0)+p.desc;});
          dt[t]={desc:tp.reduce((s,p)=>s+p.desc,0),n:tp.length,
            top:Object.entries(tA).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,d])=>({nome:n,desc:d}))};
        });return dt;})();
      return descBlock(dTotal,dPct,dN,dCat,dProds,dT);
    })()}
    <div class="sec">📅 Resultado por Dia</div>
    ${tabelaDias(dias,pe.peDia)}`;
}

function vAno(){
  // Usa historico_meses para acumular todos os meses do ano selecionado.
  // Para produtos/turnos/categorias: apenas o mês corrente está disponível em D.vendas.
  const _histAll=(D.historico_meses&&D.historico_meses.length>0)?D.historico_meses:null;
  const anoA=_histAll?_histAll[_histAll.length-1].ano:(D.vendas[D.vendas.length-1]?.ano||2026);
  const meses=_histAll?_histAll.filter(h=>h.ano===anoA):aMes(D.vendas);

  // KPIs anuais: agrega fat/n/dias de todos os meses do histórico do ano
  const K=(()=>{
    if(_histAll&&meses.length){
      const fat=+meses.reduce((s,m)=>s+(m.fat||0),0).toFixed(2);
      const n=meses.reduce((s,m)=>s+(m.n||0),0);
      const dias=meses.reduce((s,m)=>s+(m.dias||0),0)||1;
      return{fat,n,dias,ticket:n?+(fat/n).toFixed(2):0,margem:+(fat*0.65).toFixed(2),fatDia:+(fat/dias).toFixed(2)};
    }
    const vs0=fV({ano:anoA}); return aKpis(vs0);
  })();

  // Turnos: agrega por_turno de todos os meses do ano — fat/n decimais preservados
  const turnos=(()=>{
    const acc={Manha:{fat:0,n:0},Tarde:{fat:0,n:0},Noite:{fat:0,n:0}};
    meses.forEach(h=>hTurnos(h).forEach(t=>{
      if(acc[t.turno]){acc[t.turno].fat+=t.fat; acc[t.turno].n+=t.n;}
    }));
    const r=["Manha","Tarde","Noite"].map(t=>({
      turno:t, fat:acc[t].fat, n:acc[t].n,
      ticket:acc[t].n?acc[t].fat/acc[t].n:0
    }));
    // Fallback: se nenhum mês tiver por_turno, usa D.vendas do mês corrente
    const vs0=fV({ano:anoA});
    return r.some(t=>t.fat>0)?r:aTurno(vs0);
  })();
  // Produtos: merge + re-rank de top_produtos de todos os meses do ano
  const prods=(()=>{
    const vs0=fV({ano:anoA}), ps0=fP({datas:[...new Set(vs0.map(v=>v.data))]});
    return meses.some(h=>h.top_produtos?.length)?hProds(meses,10):aProd(ps0,10);
  })();
  // Categorias anuais: acumula por_cat de todos os meses; fat decimal preservado
  const catAno=(()=>{
    const hasCat=meses.some(h=>h.por_cat&&Object.keys(h.por_cat).length>0);
    if(!hasCat) return aCat(fC({ano:anoA}));
    const acc={};
    meses.forEach(h=>Object.entries(h.por_cat||{}).forEach(([c,v])=>{
      acc[c]=(acc[c]||0)+Number(v);
    }));
    return CATS.map(c=>({cat:c, fat:acc[c]||0}));
  })();
  const vs=fV({ano:anoA}); // mantido para renderAnalise (fallback D.vendas)
  const pe=calcPE(K.fat/Math.max(1,meses.length));
  const rowsMes=meses.map(m=>{
    const cobM=Math.round(m.fat/pe.peMen*100), ic=cobM>=100?"🟢":cobM>=80?"🟡":"🔴";
    const prev=meses[meses.indexOf(m)-1], dF=prev?pct(m.fat,prev.fat):null;
    return`<tr><td>${MN[m.mes]}/${m.ano}</td><td style="text-align:center">${Nb(m.n)}</td>
      <td class="tr hi">${R2(m.fat)}</td><td class="tr">${R2(m.ticket)}</td>
      <td class="tr">${R0(m.fatDia)}</td>
      <td style="text-align:center" class="${dF&&parseFloat(dF)>=0?"up":"dn"}">${dF?(parseFloat(dF)>0?"+":"")+dF+"%":"—"}</td>
      <td style="text-align:center">${ic} ${cobM}%</td></tr>`;
  }).reverse().join("");
  document.getElementById("v-ano").innerHTML=`
    <div class="sec">📊 KPIs — Acumulado ${anoA}</div>
    <div class="g5 mb">
      ${kpi("Faturamento",R2(K.fat),`${K.dias} dias úteis`,"")}
      ${kpi("Transações",Nb(K.n),`~${(K.n/K.dias).toFixed(0)}/dia`,"")}
      ${kpi("Ticket Médio",R2(K.ticket),"média anual","")}
      ${kpi("Margem Bruta",R2(K.margem),"65% do fat.","")}
      ${kpi("Fat. Médio/Dia",R2(K.fatDia),"","")}
    </div>
    <div class="sec">⚖️ Ponto de Equilíbrio</div>
    ${peBlock(K.fat/Math.max(1,meses.length),K.fatDia)}
    ${renderAnalise({vs,dias:null,turnos,prods,K,KA:null,pe,tipo:"ano"})}
    <div class="sec">📈 Evolução Mensal</div>
    <div class="cb mb"><div class="ct">Fat. por mês · ticket (âmbar) · PE (vermelho)</div>
      ${lineBarPE(meses.map(m=>m.key),meses.map(m=>m.fat),meses.map(m=>m.ticket),
        {lbls:meses.map(m=>MN[m.mes]),H:270,peDia:pe.peDia*22})}
    </div>
    <div class="sec">📉 Tendência Ticket Médio</div>
    <div class="cb mb"><div class="ct">Ticket médio mês a mês</div>
      ${lineArea(meses.map(m=>MN[m.mes]),meses.map(m=>m.ticket))}
    </div>
    <div class="sec">⏰ Faturamento por Turno</div>
    ${turnoCards(turnos)}
    <div class="sec">📊 Faturamento por Categoria — Acumulado Ano</div>
    <div class="cb mb"><div class="ct">Top categorias · maior → menor · share%</div>
      ${barH(catAno.filter(c=>c.fat>0).sort((a,b)=>b.fat-a.fat)
        .map((c,i)=>({l:c.cat,v:c.fat,c:CC[c.cat]||PAL[i]})),K.fat)}
    </div>
    <div class="sec">🏆 Top 10 Produtos do Ano</div>
    <div class="cb mb"><div class="ct">Top produtos · maior → menor · share%</div>
      ${barH(prods.map((r,i)=>({l:r.nome,v:r.fat,c:PAL[i%PAL.length]})),K.fat)}
    </div>
    <div class="sec">🏷️ Descontos do Ano — ${anoA}</div>
    ${(()=>{
      const dTotal=+meses.reduce((s,m)=>s+(m.desc_total||0),0).toFixed(2);
      const dFatB=+meses.reduce((s,m)=>s+(m.fat_bruta||0),0).toFixed(2);
      const dPct=dFatB?dTotal/dFatB:0;
      const dN=meses.reduce((s,m)=>s+(m.n_com_desc||0),0);
      const accCat={};meses.forEach(m=>Object.entries(m.por_desc_cat||{}).forEach(([c,v])=>{accCat[c]=(accCat[c]||0)+Number(v);}));
      const dCat=Object.entries(accCat).filter(([,v])=>v>0).map(([cat,desc])=>({cat,desc}));
      const dProds=hDescProds(meses,10);
      const dT=hDescTurno(meses);
      return descBlock(dTotal,dPct,dN,dCat,dProds,dT);
    })()}
    <div class="sec">📅 Resultado por Mês</div>
    <div class="tw"><table><thead><tr>
      <th>Mês</th><th style="text-align:center">Trans.</th>
      <th style="text-align:right">Fat.</th><th style="text-align:right">Ticket</th>
      <th style="text-align:right">Fat./Dia</th><th style="text-align:center">Δ Ant.</th>
      <th style="text-align:center">PE%</th>
    </tr></thead><tbody>${rowsMes}</tbody></table></div>`;
}

function vComp(){
  // Prefere D.historico_meses (pipeline pré-agrega meses anteriores + corrente).
  // Fallback: deriva dos vendas brutos (comportamento original, só mês corrente).
  const meses=(D.historico_meses&&D.historico_meses.length>0)
    ?D.historico_meses
    :aMes(D.vendas);
  if(meses.length<2){document.getElementById("v-comp").innerHTML=
    `<div style="padding:32px;text-align:center;color:var(--muted)">Comparativo disponível a partir de 2 meses de dados.<br><span style="font-size:.65rem">O pipeline acumula histórico automaticamente a cada execução.</span></div>`;return;}
  const cards=[...meses].reverse().map((m,idx,arr)=>{
    const prev=arr[idx+1]||null;
    const dF=prev?pct(m.fat,prev.fat):null,dT=prev?pct(m.ticket,prev.ticket):null,dN=prev?pct(m.n,prev.n):null;
    // Usa PE armazenado no histórico quando disponível; senão recalcula
    const peMen=m.pe_men||calcPE(m.fat).peMen;
    const mc=m.mc||calcPE(m.fat).mc;
    const cobM=Math.round(m.fat/peMen*100),ic=cobM>=100?"🟢":cobM>=80?"🟡":"🔴";
    const fdc=dF&&parseFloat(dF)>=0?"up":"dn";
    const tipoBadge=m.tipo==="final"
      ?`<span style="font-size:.55rem;color:var(--green);margin-left:4px">✓final</span>`
      :(m.tipo==="partial"?`<span style="font-size:.55rem;color:var(--amber);margin-left:4px">parcial</span>`:"");
    return`<div class="kpi" style="padding:13px">
      <div class="kl">${MN[m.mes]}/${m.ano} · ${m.dias} dias${tipoBadge}</div>
      <div class="kv">${R2(m.fat)}</div>
      <div class="kd">${dF?`<span class="${fdc}">${parseFloat(dF)>0?"+":""}${dF}% vs ant.</span>`:`<span class="nt">primeiro mês</span>`}</div>
      <div style="margin-top:7px;font-size:.7rem;color:var(--muted)">Ticket: <strong>${R2(m.ticket)}</strong>${dT?` <span class="${parseFloat(dT)>=0?"up":"dn"}">(${parseFloat(dT)>0?"+":""}${dT}%)</span>`:""}</div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:2px">Fat./dia: <strong>${R2(m.fatDia)}</strong></div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:2px">Trans.: <strong>${Nb(m.n)}</strong>${dN?` <span class="${parseFloat(dN)>=0?"up":"dn"}">(${parseFloat(dN)>0?"+":""}${dN}%)</span>`:""}</div>
      <div style="font-size:.7rem;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.07)">
        ${ic} PE: <strong>${cobM}%</strong> · MC: <strong>${(mc*100).toFixed(1)}%</strong>
        ${m.cmv_pct?`· CMV: <strong>${(m.cmv_pct*100).toFixed(0)}%</strong>`:""}
      </div>
      ${m.cmv_pe_fonte_final?`<div style="font-size:.65rem;color:#64748b;margin-top:4px">
        🔍 Real: ${m.cmv_real_pct!=null?(m.cmv_real_pct*100).toFixed(1)+"%":"—"}
        <span style="opacity:.7">(cob. ${m.cmv_real_cobertura!=null?(m.cmv_real_cobertura*100).toFixed(0)+"%":"—"})</span>
        · Cockpit: ${m.cmv_estimado_cockpit_pct!=null?(m.cmv_estimado_cockpit_pct*100).toFixed(1)+"%":"—"}
        · <span style="color:#7c3aed">fonte: ${m.cmv_pe_fonte_final}</span>
      </div>`:""}
    </div>`;
  }).join("");
  document.getElementById("v-comp").innerHTML=`
    <div class="sec">📊 Comparativo Mês a Mês</div>
    <div class="comp-grid mb">${cards}</div>
    <div class="sec">📈 Faturamento Mensal</div>
    <div class="cb mb"><div class="ct">Faturamento por mês</div>
      <svg viewBox="0 0 ${svgW()} 280" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
        ${(()=>{const W=svgW(),H=280,pl=44,pr=12,pt=24,pb=42,cw=W-pl-pr,ch=H-pt-pb,n=meses.length;
          const bw=Math.min(60,cw/n*.70),gap=(cw-bw*n)/(n+1),maxV=Math.max(...meses.map(m=>m.fat))||1;
          let s=GL(pl,pr,pt,pb,W,H,4,maxV);
          meses.forEach((m,i)=>{
            const x=pl+gap*(i+1)+bw*i,bh=ch*(m.fat/maxV),y=pt+ch-bh;
            s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${PAL[i%PAL.length]}" opacity="0.9"/>`;
            s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" fill="#E2E8F0" font-size="8.5" font-family="Segoe UI,sans-serif">R$${Math.round(m.fat).toLocaleString("pt-BR")}</text>`;
            s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-pb+13).toFixed(1)}" text-anchor="middle" fill="#9CA3AF" font-size="9" font-family="Segoe UI,sans-serif">${MN[m.mes]}/${m.ano}</text>`;
          });
          return s;})()}
      </svg>
    </div>
    <div class="sec">🏅 Melhor e Pior Dia por Mês</div>
    <div class="tw"><table><thead><tr>
      <th>Mês</th><th>Melhor Dia</th><th style="text-align:right">Fat.</th>
      <th>Pior Dia</th><th style="text-align:right">Fat.</th>
    </tr></thead><tbody>
    ${[...meses].reverse().map(m=>{
      // Histórico armazena por_dia; mês corrente fallback para D.vendas
      const raw=m.por_dia
        ?m.por_dia.map(d=>({data:d.data,dia:d.dia||"",fat:+(d.faturamento||d.fat||0)}))
        :aPorDia(fV({mes:m.mes,ano:m.ano}));
      if(!raw||!raw.length)return`<tr><td>${MN[m.mes]}/${m.ano}</td><td colspan="4" style="color:var(--dim)">sem dados de dias</td></tr>`;
      const melhor=raw.reduce((a,b)=>b.fat>a.fat?b:a,raw[0]);
      const pior=raw.reduce((a,b)=>b.fat<a.fat?b:a,raw[0]);
      return`<tr>
        <td>${MN[m.mes]}/${m.ano}</td>
        <td>${melhor?.data.slice(5)||"—"} (${melhor?.dia||""})</td>
        <td class="tr hi">${melhor?R2(melhor.fat):"—"}</td>
        <td>${pior?.data.slice(5)||"—"} (${pior?.dia||""})</td>
        <td class="tr" style="color:var(--red)">${pior?R2(pior.fat):"—"}</td>
      </tr>`;
    }).join("")}
    </tbody></table></div>`;
}
