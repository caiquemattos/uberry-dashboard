<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão de Dono — Avaliação de Maturidade</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#2557B7;--blue-dark:#1A3D8F;--blue-light:#EBF2FF;--blue-mid:#3B82F6;
  --black:#111827;--gray:#6B7280;--gray-light:#9CA3AF;--border:#E5E7EB;
  --bg:#F8FAFC;--card:#FFFFFF;--red:#EF4444;--green:#10B981;--amber:#F59E0B;
  --r:10px;--shadow:0 1px 6px rgba(0,0,0,.1);
}
body{background:var(--bg);color:var(--black);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:15px;min-height:100vh}
a{color:var(--blue);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}

/* ── HEADER ── */
.header{background:#fff;border-bottom:2px solid var(--blue);padding:0 20px;height:60px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(37,87,183,.12)}
.logo{display:flex;align-items:center;gap:10px}
.logo-text{line-height:1.1}
.logo-text .gestao{font-size:.85rem;font-weight:700;color:var(--black);letter-spacing:.02em}
.logo-text .dono{font-size:1.1rem;font-weight:900;color:#fff;background:var(--blue);
  padding:1px 8px;border-radius:3px;display:inline-block}
.header-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--gray)}
.user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);
  color:#fff;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.btn-logout{background:none;border:1px solid var(--border);border-radius:6px;
  padding:5px 12px;font-size:.78rem;color:var(--gray)}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* ── LAYOUT ── */
.page{max-width:900px;margin:0 auto;padding:24px 16px}
.page-wide{max-width:1100px;margin:0 auto;padding:24px 16px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 22px;border-radius:8px;font-weight:600;font-size:.9rem;border:none;transition:.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-secondary{background:var(--blue-light);color:var(--blue);border:1px solid #c7d9f8}
.btn-secondary:hover{background:#dbeafe}
.btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow)}
.card-title{font-size:1rem;font-weight:700;margin-bottom:4px}
.card-sub{font-size:.82rem;color:var(--gray);margin-bottom:16px}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--black)}
.form-label span{color:var(--red)}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;
  font-size:.9rem;outline:none;transition:.15s;background:#fff}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,87,183,.12)}
.form-input.err{border-color:var(--red)}
.form-select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;
  font-size:.9rem;outline:none;background:#fff;appearance:none;cursor:pointer}
.form-select:focus{border-color:var(--blue)}
.form-error{font-size:.78rem;color:var(--red);margin-top:4px}
.form-hint{font-size:.78rem;color:var(--gray);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}

/* ── ALERTS ── */
.alert{padding:12px 16px;border-radius:8px;font-size:.85rem;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}
.alert-info{background:#EBF2FF;border:1px solid #c7d9f8;color:var(--blue-dark)}
.alert-success{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.badge-blue{background:var(--blue-light);color:var(--blue)}
.badge-green{background:#ecfdf5;color:#065f46}
.badge-amber{background:#fffbeb;color:#92400e}
.badge-red{background:#fef2f2;color:#991b1b}
.badge-gray{background:#f3f4f6;color:#374151}

/* ── LANDING ── */
.landing{min-height:100vh;background:linear-gradient(160deg,#f0f5ff 0%,#fff 60%)}
.landing-hero{text-align:center;padding:60px 20px 40px}
.landing-logo{margin-bottom:24px}
.landing-logo .g1{font-size:2.2rem;font-weight:900;color:var(--black);letter-spacing:-.02em}
.landing-logo .g2{display:inline-block;font-size:2.8rem;font-weight:900;color:#fff;
  background:var(--blue);padding:2px 18px;border-radius:6px;margin-top:-4px}
.landing-hero h2{font-size:1.3rem;color:var(--gray);font-weight:400;margin-top:20px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.6}
.landing-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:680px;margin:40px auto 0}
@media(max-width:560px){.landing-cards{grid-template-columns:1fr;padding:0 16px}}
.landing-card{background:#fff;border:2px solid var(--border);border-radius:16px;
  padding:30px 24px;text-align:center;cursor:pointer;transition:.2s}
.landing-card:hover{border-color:var(--blue);box-shadow:0 4px 20px rgba(37,87,183,.15);transform:translateY(-2px)}
.landing-card .icon{font-size:2.5rem;margin-bottom:12px}
.landing-card h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.landing-card p{font-size:.85rem;color:var(--gray);line-height:1.5}
.landing-footer{text-align:center;padding:40px 20px 20px;color:var(--gray-light);font-size:.8rem}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;background:linear-gradient(160deg,#f0f5ff 0%,#fff 60%);
  display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;border:1px solid var(--border);border-radius:16px;
  padding:36px 32px;width:100%;max-width:460px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo .g1{font-size:1.4rem;font-weight:900;color:var(--black)}
.auth-logo .g2{display:inline-block;font-size:1.8rem;font-weight:900;color:#fff;
  background:var(--blue);padding:1px 12px;border-radius:4px}
.auth-title{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.auth-sub{font-size:.85rem;color:var(--gray);margin-bottom:24px}
.auth-switch{text-align:center;margin-top:20px;font-size:.85rem;color:var(--gray)}
.auth-switch a{font-weight:600}

/* ── CODE INPUT ── */
.code-input-wrap{display:flex;gap:8px;justify-content:center;margin:16px 0}
.code-input{width:46px;height:52px;border:2px solid var(--border);border-radius:8px;
  text-align:center;font-size:1.4rem;font-weight:700;outline:none;text-transform:uppercase;
  transition:.15s}
.code-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,87,183,.12)}
.code-display{background:var(--blue-light);border:2px dashed var(--blue);border-radius:10px;
  padding:14px 24px;text-align:center}
.code-display .code-val{font-size:2rem;font-weight:900;letter-spacing:.2em;color:var(--blue);font-family:monospace}
.code-display .code-lbl{font-size:.78rem;color:var(--gray);margin-top:4px}

/* ── QUESTIONNAIRE ── */
.q-header{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;
  position:sticky;top:60px;z-index:90}
.q-progress-bar{height:6px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}
.q-progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:.4s}
.q-meta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--gray)}
.q-dim-name{font-weight:700;color:var(--black)}
.q-count{color:var(--gray)}

.q-body{max-width:720px;margin:0 auto;padding:24px 16px}
.q-dim-header{margin-bottom:24px}
.q-dim-badge{display:inline-block;background:var(--blue-light);color:var(--blue);
  font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:99px;margin-bottom:8px}
.q-dim-title{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.q-dim-desc{font-size:.88rem;color:var(--gray);line-height:1.5}

.q-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:16px;transition:.2s}
.q-card.answered{border-color:#a7f3d0}
.q-text{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:16px}
.q-help{font-size:.8rem;color:var(--gray);margin-top:-10px;margin-bottom:14px;line-height:1.4}
.scale-options{display:flex;flex-direction:column;gap:8px}
.scale-opt{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;
  border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
.scale-opt:hover{border-color:var(--blue-mid);background:#f8faff}
.scale-opt.selected{border-color:var(--blue);background:var(--blue-light)}
.scale-opt input[type=radio]{accent-color:var(--blue);width:16px;height:16px;flex-shrink:0;margin-top:2px}
.scale-opt-label{flex:1}
.scale-opt-num{font-weight:700;color:var(--blue);font-size:.85rem}
.scale-opt-desc{font-size:.82rem;color:var(--gray);margin-top:1px}
.comment-area{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px;
  font-size:.85rem;resize:vertical;min-height:70px;outline:none;margin-top:10px;transition:.15s}
.comment-area:focus{border-color:var(--blue)}
.comment-toggle{font-size:.78rem;color:var(--blue);cursor:pointer;margin-top:8px;display:inline-block}

.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}

/* ── RESULTS ── */
.result-hero{text-align:center;padding:32px 20px 24px;background:#fff;border-bottom:1px solid var(--border)}
.result-score-big{font-size:3.5rem;font-weight:900;color:var(--blue);line-height:1}
.result-score-max{font-size:1rem;color:var(--gray);font-weight:400}
.result-classification{display:inline-block;margin-top:8px;padding:6px 18px;border-radius:99px;font-weight:700;font-size:.95rem}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.result-grid{grid-template-columns:1fr}}
.radar-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.radar-title{font-size:.9rem;font-weight:700;margin-bottom:12px}
.radar-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:12px;height:4px;border-radius:2px}
.dim-table{width:100%;border-collapse:collapse;font-size:.85rem}
.dim-table th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);font-size:.75rem;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
.dim-table td{padding:9px 12px;border-bottom:1px solid var(--border)}
.dim-table tr:last-child td{border-bottom:none}
.score-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;width:100%}
.score-bar-fill{height:100%;border-radius:3px;background:var(--blue)}
.respondents-note{font-size:.8rem;color:var(--gray);margin-top:6px}

/* ── ADMIN ── */
.admin-tabs{display:flex;gap:2px;border-bottom:2px solid var(--border);margin-bottom:24px;overflow-x:auto}
.admin-tab{padding:10px 20px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;
  background:none;color:var(--gray);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.admin-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.admin-tab:hover{color:var(--black)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:700px){.stat-grid{grid-template-columns:1fr 1fr}}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-val{font-size:1.8rem;font-weight:900;color:var(--blue)}
.stat-lbl{font-size:.78rem;color:var(--gray);margin-top:2px}
.data-table{width:100%;border-collapse:collapse;font-size:.85rem}
.data-table th{text-align:left;padding:10px 12px;background:#f9fafb;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tr:hover td{background:#f8faff}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff}

/* ── MISC ── */
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.gap8{gap:8px}.gap12{gap:12px}
.text-sm{font-size:.82rem}.text-xs{font-size:.75rem}.text-gray{color:var(--gray)}
.text-blue{color:var(--blue)}.font-bold{font-weight:700}.text-center{text-align:center}
.spinner{border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;
  width:28px;height:28px;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--gray)}
.empty-icon{font-size:2.5rem;margin-bottom:10px}

/* ── STATUS INDICATORS ── */
.status{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600}
.status::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-active::before{background:var(--green)}
.status-paused::before{background:var(--amber)}
.status-closed::before{background:var(--red)}
.status-draft::before{background:var(--gray)}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#111;color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;
  z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto}
.modal-title{font-size:1.1rem;font-weight:700;margin-bottom:16px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

@media(max-width:480px){
  .auth-box{padding:24px 16px}
  .q-body{padding:14px 10px}
  .page{padding:14px 12px}
  .page-wide{padding:14px 12px}
  .landing-hero{padding:36px 14px 20px}
  .landing-logo .g1{font-size:1.7rem}
  .landing-logo .g2{font-size:2.2rem}
  .landing-hero h2{font-size:1.1rem}
  .q-dim-title{font-size:1.1rem}
  .modal{padding:20px 16px}
  .result-hero{padding:22px 14px 16px}
  .result-score-big{font-size:2.8rem}
  .code-input{width:40px;height:46px;font-size:1.2rem}
  .admin-tabs{gap:0}
  .admin-tab{padding:8px 12px;font-size:.78rem}
}
/* Touch targets */
.scale-opt{min-height:48px;padding:12px 14px}
@media(max-width:600px){
  .q-nav{flex-direction:column-reverse;gap:10px}
  .q-nav .btn{width:100%;justify-content:center}
  .radar-wrap canvas{max-height:260px!important}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
/* Privacy disclaimer block */
.privacy-note{background:#f9fafb;border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;font-size:.78rem;color:var(--gray);line-height:1.6;margin-top:10px}
.privacy-note strong{color:var(--black)}
/* Share disclaimer */
.share-disclaimer{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;
  padding:14px;font-size:.82rem;color:#92400e;line-height:1.6;margin-bottom:16px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="modal-root"></div>
<div id="header-root"></div>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════
//  DATA LAYER  (localStorage)
// ══════════════════════════════════════════════
const DB = {
  get(k){try{return JSON.parse(localStorage.getItem(k))||null}catch{return null}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  users(){return this.get('gd_users')||[]},
  saveUsers(u){this.set('gd_users',u)},
  groups(){return this.get('gd_groups')||[]},
  saveGroups(g){this.set('gd_groups',g)},
  sessions(){return this.get('gd_sessions')||[]},
  saveSessions(s){this.set('gd_sessions',s)},
  currentUser(){return this.get('gd_current')},
  login(u){this.set('gd_current',u)},
  logout(){localStorage.removeItem('gd_current')},
  questionnaire(){return this.get('gd_questionnaire')||DEFAULT_Q},
  saveQuestionnaire(q){this.set('gd_questionnaire',q)},
  resultTexts(){return this.get('gd_result_texts')||DEFAULT_RESULT_TEXTS},
};

// ── Default admin user
function ensureAdmin(){
  const users = DB.users();
  if(!users.find(u=>u.role==='admin')){
    users.push({id:'admin-1',name:'Administrador',email:'admin@gestaododono.com.br',
      password:'admin123',role:'admin',company:'C1.SHIFT',position:'Admin',
      createdAt:new Date().toISOString()});
    DB.saveUsers(users);
  }
}

// ══════════════════════════════════════════════
//  QUESTIONNAIRE DATA
// ══════════════════════════════════════════════
const DEFAULT_Q = {
  id:'q1',
  title:'Avaliação de Maturidade de Gestão',
  description:'Avalie a maturidade de gestão da sua empresa em 8 dimensões fundamentais.',
  version:'1.0',
  status:'active',
  createdAt:new Date().toISOString(),
  dimensions:[
    {
      id:'dim1',name:'Direção e Prioridades',order:1,weight:1,
      description:'Clareza sobre para onde a empresa vai e o que é prioridade.',
      questions:[
        {id:'d1q1',text:'A empresa tem metas claras e conhecidas para os próximos 12 meses.',required:true},
        {id:'d1q2',text:'As prioridades estratégicas são comunicadas e compreendidas pelas lideranças.',required:true},
        {id:'d1q3',text:'As decisões estratégicas seguem critérios definidos, e não apenas intuição do dono.',required:true},
        {id:'d1q4',text:'A empresa revisa e ajusta seu planejamento de forma regular.',required:true},
      ]
    },
    {
      id:'dim2',name:'Papéis e Responsabilidades',order:2,weight:1,
      description:'Clareza sobre quem faz o quê, quem decide e quem presta contas.',
      questions:[
        {id:'d2q1',text:'Está claro quem decide, quem executa e quem acompanha os principais temas da empresa.',required:true},
        {id:'d2q2',text:'Os papéis e responsabilidades dos líderes estão formalizados e são respeitados.',required:true},
        {id:'d2q3',text:'Quando surge um problema, as pessoas sabem quem é o responsável por resolvê-lo.',required:true},
        {id:'d2q4',text:'Não há sobreposição relevante de funções que gere conflito ou retrabalho.',required:true},
      ]
    },
    {
      id:'dim3',name:'Decisão e Autonomia',order:3,weight:1,
      description:'Capacidade da empresa de decidir e agir sem depender excessivamente dos donos.',
      questions:[
        {id:'d3q1',text:'Se o principal sócio/dono se afastasse por 30 dias, as decisões importantes continuariam sendo tomadas.',required:true},
        {id:'d3q2',text:'Os líderes têm autonomia e clareza suficientes para tomar decisões em sua área sem precisar consultar o dono a todo momento.',required:true},
        {id:'d3q3',text:'Existe critério claro sobre quais decisões precisam do dono e quais podem ser delegadas.',required:true},
        {id:'d3q4',text:'A empresa não trava quando algum líder-chave está ausente.',required:true},
      ]
    },
    {
      id:'dim4',name:'Reuniões e Execução',order:4,weight:1,

function genId(prefix){return (prefix||'id')+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)}
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<6;i++)r+=c[Math.floor(Math.random()*c.length)];return r}
function ensureUniqueCode(){let c,tries=0;do{c=genCode();tries++}while(DB.groups().find(g=>g.code===c)&&tries<100);return c}

function toast(msg,dur=2500){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}

function escHtml(s){
  if(s==null)return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scoreColor(s){if(s>=3.6)return '#10B981';if(s>=2.6)return '#2557B7';if(s>=1.1)return '#F59E0B';return '#EF4444';}
function scoreBg(s){if(s>=3.6)return '#ecfdf5';if(s>=2.6)return '#EBF2FF';if(s>=1.1)return '#fffbeb';return '#fef2f2';}

function getResultText(score){
  const texts=DB.resultTexts();
  return texts.find(t=>score>=t.min&&score<=t.max)||texts[0];
}

function calcScores(session, questionnaire){
  const answers=session.answers||{};
  const dimScores={};
  let total=0,count=0;
  for(const dim of questionnaire.dimensions){
    let ds=0,dc=0;
    for(const q of dim.questions){
      const a=answers[q.id];
      if(a!=null&&a.value!=null){ds+=a.value;dc++;}
    }
    dimScores[dim.id]=dc>0?Math.round((ds/dc)*100)/100:null;
    if(dc>0){total+=ds;count+=dc;}
  }
  const overall=count>0?Math.round((total/count)*100)/100:null;
  return{dimScores,overall};
}

function calcGroupScores(sessions, questionnaire){
  const completed=sessions.filter(s=>s.status==='completed');
  if(!completed.length)return null;
  const allDimScores={};
  const allOverall=[];
  for(const s of completed){
    const sc=calcScores(s,questionnaire);
    allOverall.push(sc.overall);
    for(const dim of questionnaire.dimensions){
      if(!allDimScores[dim.id])allDimScores[dim.id]=[];
      if(sc.dimScores[dim.id]!=null)allDimScores[dim.id].push(sc.dimScores[dim.id]);
    }
  }
  const avgDim={};
  for(const k in allDimScores){
    const vals=allDimScores[k];
    avgDim[k]=vals.length?Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*100)/100:null;
  }
  const validAll=allOverall.filter(v=>v!=null);
  const avgOverall=validAll.length?Math.round((validAll.reduce((a,b)=>a+b,0)/validAll.length)*100)/100:null;
  return{dimScores:avgDim,overall:avgOverall,count:completed.length};
}

function calcOthersScores(sessions, currentSessionId, questionnaire){
  const others=sessions.filter(s=>s.status==='completed'&&s.id!==currentSessionId);
  if(!others.length)return null;
  return calcGroupScores(others,questionnaire);
}

  const wrap=document.getElementById('code-inputs');

  setupCodeInputs();
}

function setupCodeInputs(){
  for(let i=0;i<6;i++){
    const el=document.getElementById('ci'+i);
    if(!el)continue;
    el.addEventListener('input',e=>{
      e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(e.target.value&&i<5)document.getElementById('ci'+(i+1))?.focus();
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Backspace'&&!e.target.value&&i>0)document.getElementById('ci'+(i-1))?.focus();
    });
    el.addEventListener('paste',e=>{
      e.preventDefault();
      const txt=(e.clipboardData.getData('text')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
      txt.split('').forEach((c,j)=>{const inp=document.getElementById('ci'+j);if(inp)inp.value=c;});
      document.getElementById('ci'+(txt.length<5?txt.length:5))?.focus();
    });
  }
}

function getCodeValue(){return Array.from({length:6},(_,i)=>document.getElementById('ci'+i)?.value||'').join('');}

function submitPublicCode(){
  const code=getCodeValue();
  if(code.length!==6){document.getElementById('code-err').classList.remove('hidden');return;}
  const group=DB.groups().find(g=>g.code===code&&g.status==='active');
  if(!group){document.getElementById('code-err').classList.remove('hidden');return;}
  closeModal();
  Pending.code=code;
  Pending.newGroup=false;

}

  const company=document.getElementById('r-company').value.trim();
  const email=document.getElementById('r-email').value.trim().toLowerCase();
  const phone=document.getElementById('r-phone').value.trim();
  const position=document.getElementById('r-position').value.trim();
  const profile=document.getElementById('r-profile').value;
  const pass=document.getElementById('r-pass').value;
  const err=document.getElementById('reg-err');
  if(!name||!company||!email||!profile||!pass){
    err.innerHTML='<div class="alert alert-error">Preencha todos os campos obrigatórios.</div>';return;
  }
  if(pass.length<6){err.innerHTML='<div class="alert alert-error">A senha deve ter pelo menos 6 caracteres.</div>';return;}
  const users=DB.users();
  if(users.find(u=>u.email===email)){
    err.innerHTML='<div class="alert alert-error">Este e-mail já está cadastrado. <a href="#" onclick="Router.go(\'login\')">Entrar →</a></div>';return;
  }
  const user={id:genId('u'),name,company,email,phone,position,profile,password:pass,
    role:'respondent',createdAt:new Date().toISOString()};
  users.push(user);DB.saveUsers(users);DB.login(user);
  afterAuth(user);
}

  const code=Pending.code;

    toast('Código inválido ou inativo.',3000);
  }
  if(isNewGroup){Pending.clear();Router.go('group-setup');return;}
  Router.go('home');
}

        <div class="form-hint">Opcional. Ajuda a identificar esta avaliação no futuro.</div>
      </div>
      <div class="alert alert-info">
        Um código único de 6 dígitos será gerado para esta empresa. Ele identifica a empresa avaliada — não você como respondente. Compartilhe apenas com pessoas que devem participar desta avaliação (sócios, líderes, familiares).
      </div>
      <button class="btn btn-primary btn-block mt12" onclick="doCreateGroup()">Gerar código e iniciar avaliação</button>

}

function doCreateGroup(){
  const u=DB.currentUser();
  const company=document.getElementById('gs-company').value.trim();
  const groupName=document.getElementById('gs-group').value.trim();
  if(!company){toast('Informe o nome da empresa.');return;}
  const code=ensureUniqueCode();
  const group={id:genId('g'),code,companyName:company,groupName:groupName||company,
    createdBy:u.id,status:'active',createdAt:new Date().toISOString()};
  const groups=DB.groups();groups.push(group);DB.saveGroups(groups);
  startSession(u,group);
}

function startSession(user,group){
  const q=DB.questionnaire();
  const existing=DB.sessions().find(s=>s.userId===user.id&&s.groupId===group.id&&s.questionnaireId===q.id);
  if(existing){
    // Completed → results; in_progress/reopened → questionnaire
    if(existing.status==='completed')Router.go('results',{sessionId:existing.id});
    else Router.go('questionnaire',{sessionId:existing.id});
    return;
  }
  const session={id:genId('s'),userId:user.id,groupId:group.id,questionnaireId:q.id,
    status:'in_progress',answers:{},startedAt:new Date().toISOString(),createdAt:new Date().toISOString()};
  const sessions=DB.sessions();sessions.push(session);DB.saveSessions(sessions);
  Router.go('questionnaire',{sessionId:session.id});
}

function submitJoinCode(){
  const u=DB.currentUser();
  const code=getCodeValue();
  if(code.length!==6){document.getElementById('code-err').classList.remove('hidden');return;}
  const group=DB.groups().find(g=>g.code===code&&g.status==='active');
  if(!group){document.getElementById('code-err').classList.remove('hidden');return;}
  const q=DB.questionnaire();
  const existing=DB.sessions().find(s=>s.userId===u.id&&s.groupId===group.id&&s.questionnaireId===q.id);
  closeModal();

function calcProgress(session,questionnaire){
  const total=questionnaire.dimensions.reduce((a,d)=>a+d.questions.length,0);
  const done=Object.values(session.answers||{}).filter(a=>a.value!=null).length;
  return Math.round((done/total)*100);
}

// ══════════════════════════════════════════════
let QState={dimIdx:0,session:null,questionnaire:null};

function renderQuestionnaire(app,params){
  const session=DB.sessions().find(s=>s.id===params.sessionId);
  if(!session){Router.go('home');return;}
  if(session.status==='completed'){Router.go('results',{sessionId:session.id});return;}
  const q=DB.questionnaire();
  QState={dimIdx:0,session,questionnaire:q};
  // Find first unanswered dimension
  for(let i=0;i<q.dimensions.length;i++){
    const dim=q.dimensions[i];
    const allDone=dim.questions.every(qn=>session.answers[qn.id]?.value!=null);
    if(!allDone){QState.dimIdx=i;break;}
    if(i===q.dimensions.length-1)QState.dimIdx=i;
  }
  renderDimension(app);
}

function renderDimension(app){
  const{questionnaire:q,session,dimIdx}=QState;
  const group=DB.groups().find(g=>g.id===session.groupId);
  const totalQ=q.dimensions.reduce((a,d)=>a+d.questions.length,0);
  const doneQ=Object.values(session.answers||{}).filter(a=>a.value!=null).length;
  const pct=Math.round((doneQ/totalQ)*100);
  const dim=q.dimensions[dimIdx];
  const isLast=dimIdx===q.dimensions.length-1;

  app.innerHTML=`
  <div class="q-header">
    <div class="q-meta">
      <span class="q-dim-name">${escHtml(dim.name)}</span>
      <span class="q-count" style="text-align:right">${dimIdx+1}/${q.dimensions.length} · ${pct}%</span>
    </div>
    ${group?`<div class="text-xs text-gray" style="margin-top:2px">Empresa: <strong>${escHtml(group.companyName)}</strong></div>`:''}
    <div class="q-progress-bar"><div class="q-progress-fill" style="width:${pct}%"></div></div>
  </div>
  <div class="q-body">
    <div class="q-dim-header">
      <div class="q-dim-badge">Dimensão ${dimIdx+1}</div>
      <div class="q-dim-title">${escHtml(dim.name)}</div>
      <div class="q-dim-desc">${escHtml(dim.description)}</div>
    </div>
    <div class="alert alert-info mb16" style="font-size:.8rem">
      <div><strong>Como avaliar:</strong> 0 = Não existe · 1 = Informal · 2 = Parcial · 3 = Frequente · 4 = Estruturado</div>
    </div>
    ${dim.questions.map((qn,qi)=>renderQuestionCard(qn,qi,session)).join('')}
    <div class="q-nav">
      <button class="btn btn-secondary btn-sm" onclick="navDim(-1)" ${dimIdx===0?'disabled':''}>← Anterior</button>
      <button class="btn btn-primary btn-sm" onclick="navDim(1)" id="btn-next">
        ${isLast?'Ver resultado →':'Próxima dimensão →'}
      </button>
    </div>
  </div>`;

  // Attach scale option listeners
  dim.questions.forEach(qn=>{
    SCALE.forEach(opt=>{
      const el=document.getElementById(`opt-${qn.id}-${opt.value}`);
      if(el)el.addEventListener('change',()=>saveAnswer(qn.id,'value',opt.value));
    });
    const commentToggle=document.getElementById(`ct-${qn.id}`);
    if(commentToggle){
      commentToggle.addEventListener('click',e=>{
        e.preventDefault();
        const area=document.getElementById(`ca-${qn.id}`);
        area.classList.toggle('hidden');
      });
    }
    const commentArea=document.getElementById(`ca-${qn.id}`);
    if(commentArea){
      commentArea.addEventListener('input',e=>saveAnswer(qn.id,'comment',e.target.value));
    }
  });
}

function renderQuestionCard(qn,qi,session){
  const ans=session.answers[qn.id]||{};
  const answered=ans.value!=null;
  const commentVal=escHtml(ans.comment||'');
  const opts=SCALE.map(opt=>{
    const sel=ans.value===opt.value?'selected':'';
    const chk=ans.value===opt.value?'checked':'';
    return `
    <label class="scale-opt ${sel}">
      <input type="radio" name="q-${qn.id}" id="opt-${qn.id}-${opt.value}" value="${opt.value}" ${chk} />
      <div class="scale-opt-label">
        <div class="scale-opt-num">${opt.value}</div>
        <div class="scale-opt-desc">${escHtml(opt.label)}</div>
      </div>
    </label>`;
  }).join('');
  return `
  <div class="q-card ${answered?'answered':''}" id="qcard-${qn.id}">
    <div class="q-text">${qi+1}. ${escHtml(qn.text)}</div>
    <div class="scale-options">${opts}</div>
    <a href="#" class="comment-toggle" id="ct-${qn.id}">+ Comentar sobre essa resposta</a>
    <textarea class="comment-area hidden" id="ca-${qn.id}" placeholder="Descreva um exemplo ou situação...">${commentVal}</textarea>
  </div>`;
}

function saveAnswer(qId,field,value){
  const session=DB.sessions().find(s=>s.id===QState.session.id);
  if(!session)return;
  if(!session.answers[qId])session.answers[qId]={};
  session.answers[qId][field]=value;
  session.updatedAt=new Date().toISOString();
  // Update in DB
  const sessions=DB.sessions();
  const idx=sessions.findIndex(s=>s.id===session.id);
  if(idx>-1){sessions[idx]=session;DB.saveSessions(sessions);}
  QState.session=session;
  // Update card style
  const card=document.getElementById('qcard-'+qId);
  if(card&&field==='value'){card.classList.toggle('answered',value!=null);}
  // Update scale option highlight
  const dim=QState.questionnaire.dimensions[QState.dimIdx];
  if(dim.questions.find(q=>q.id===qId)){
    SCALE.forEach(opt=>{
      const lbl=document.getElementById('opt-'+qId+'-'+opt.value)?.closest('.scale-opt');
      if(lbl)lbl.classList.toggle('selected',opt.value===value);
    });
  }
}

function navDim(dir){
  const{questionnaire:q,session,dimIdx}=QState;
  const dim=q.dimensions[dimIdx];
  const requiredNotDone=dim.questions.filter(qn=>qn.required&&session.answers[qn.id]?.value==null);
  if(dir>0&&requiredNotDone.length){toast(`Responda todas as ${requiredNotDone.length} pergunta(s) desta dimensão.`);return;}
  const newIdx=dimIdx+dir;
  if(newIdx<0){Router.go('home');return;}
  if(newIdx>=q.dimensions.length){
    // Final: check all required answered
    const allRequired=q.dimensions.every(d=>d.questions.every(qn=>!qn.required||session.answers[qn.id]?.value!=null));
    if(!allRequired){toast('Complete todas as perguntas obrigatórias para finalizar.');return;}
    confirmFinish();return;
  }
  QState.dimIdx=newIdx;
  renderDimension(document.getElementById('app'));
  window.scrollTo(0,0);
}

function confirmFinish(){
  const bg=document.getElementById('modal-root');
  bg.innerHTML=`
  <div class="modal-bg">
    <div class="modal">
      <div class="modal-title">Concluir avaliação?</div>
      <p class="text-sm text-gray" style="margin-bottom:16px;line-height:1.6">
        Ao concluir, suas respostas serão salvas e você não poderá mais editá-las.<br>
        Deseja finalizar a avaliação agora?
      </p>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Revisar respostas</button>
        <button class="btn btn-primary btn-sm" onclick="finishSession()">Sim, concluir</button>
      </div>
    </div>
  </div>`;
}

function finishSession(){
  const session=DB.sessions().find(s=>s.id===QState.session.id);
  if(!session)return;
  session.status='completed';
  session.completedAt=new Date().toISOString();
  const sessions=DB.sessions();
  const idx=sessions.findIndex(s=>s.id===session.id);
  if(idx>-1){sessions[idx]=session;DB.saveSessions(sessions);}
  closeModal();
  Router.go('results',{sessionId:session.id});
}

let radarChart=null;

      <div class="legend-item"><div class="legend-dot" style="background:#F59E0B"></div>Média geral do grupo</div>
    </div>`:`<div class="radar-legend"><div class="legend-item"><div class="legend-dot" style="background:#2557B7"></div>Minha nota individual</div></div>`;

  app.innerHTML=`
  <div class="result-hero">

    <div class="result-score-big" style="color:${scoreColor(myScores.overall)}">${myScores.overall.toFixed(1)}</div>
    <div class="result-score-max">/ 4,0 — minha avaliação</div>
    <div class="result-classification ${rt?.badge||''}" style="background:${scoreBg(myScores.overall)};color:${scoreColor(myScores.overall)}">${rt?.classification||''}</div>
    `:'<div class="text-gray">Cálculo não disponível</div>'}
    ${hasMultiple?`<div class="respondents-note mt8">${completedCount} respondentes concluíram neste grupo</div>`:'<div class="respondents-note mt8">Você é o único respondente até agora</div>'}
  </div>
  <div class="page">
    ${rt?`
    <div class="card mb16">
      <div class="card-title">Leitura do resultado</div>
      <p class="text-sm" style="line-height:1.7;color:var(--gray);margin-top:8px">${escHtml(rt.text)}</p>
      <div class="mt12 alert alert-info" style="font-size:.82rem"><strong>Próximo passo sugerido:</strong> ${escHtml(rt.next)}</div>

function buildRadar(q,myScores,othersScores,groupScores){
  const canvas=document.getElementById('radar-canvas');
  if(!canvas)return;
  if(radarChart){radarChart.destroy();radarChart=null;}
  const labels=q.dimensions.map(d=>d.name);
  const myData=q.dimensions.map(d=>myScores.dimScores[d.id]??0);
  const datasets=[{
    label:'Minha nota',data:myData,
    borderColor:'#2557B7',backgroundColor:'rgba(37,87,183,.15)',
    borderWidth:2,pointBackgroundColor:'#2557B7',pointRadius:4
  }];
  if(othersScores){
    datasets.push({
      label:'Média dos demais',data:q.dimensions.map(d=>othersScores.dimScores[d.id]??0),
      borderColor:'#10B981',backgroundColor:'rgba(16,185,129,.1)',
      borderWidth:2,pointBackgroundColor:'#10B981',pointRadius:4,borderDash:[5,3]
    });
  }
  if(groupScores&&!othersScores){
    datasets.push({
      label:'Média do grupo',data:q.dimensions.map(d=>groupScores.dimScores[d.id]??0),
      borderColor:'#F59E0B',backgroundColor:'rgba(245,158,11,.1)',
      borderWidth:2,pointBackgroundColor:'#F59E0B',pointRadius:4,borderDash:[5,3]
    });
  } else if(groupScores&&othersScores){
    datasets.push({
      label:'Média do grupo',data:q.dimensions.map(d=>groupScores.dimScores[d.id]??0),

function exportMyCSV(sessionId){
  const session=DB.sessions().find(s=>s.id===sessionId);if(!session)return;
  const u=DB.users().find(u=>u.id===session.userId)||{name:'—'};
  const q=DB.questionnaire();
  const scores=calcScores(session,q);
  let rows=[['Empresa','Respondente','Perfil','Dimensão','Pergunta','Nota','Comentário']];
  const group=DB.groups().find(g=>g.id===session.groupId)||{companyName:'—'};
  q.dimensions.forEach(dim=>{
    dim.questions.forEach(qn=>{
      const ans=session.answers[qn.id]||{};
      rows.push([group.companyName,u.name,u.profile||'—',dim.name,qn.text,ans.value??'',ans.comment||'']);
    });
  });
  downloadCSV(rows,`avaliacao_${group.code}_${u.name.replace(/\s+/g,'_')}.csv`);
}

function downloadCSV(rows,filename){
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download=filename;a.click();
}

function init(){
  ensureAdmin();
  // Handle ?codigo= in URL — set Pending then route
  const urlParams=new URLSearchParams(location.search);
  const rawCode=(urlParams.get('codigo')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(rawCode.length===6){
    const group=DB.groups().find(g=>g.code===rawCode&&g.status==='active');
    if(group){
      const u=DB.currentUser();
      if(u){startSession(u,group);return;}
      // Not logged in — store code and route to register
      Pending.code=rawCode;
      Pending.newGroup=false;
      Router.go('register');
      return;
    }
  }
  const u=DB.currentUser();
  if(u){
    if(u.role==='admin')Router.go('admin');
    else Router.go('home');
  } else {
    Router.go('landing');
  }
}

init();
